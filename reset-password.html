<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GEN-Z.AI - Reset Password</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08090d;
      color: white;
      font-family:
        Inter,
        system-ui,
        sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #111217;
      border: 1px solid #292c34;
      border-radius: 18px;
      padding: 25px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    p {
      color: #999;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      color: #bbb;
      font-size: 12px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #30333c;
      background: #090a0e;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: #08090d;
      font-weight: 800;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 9px;
      background: #0b0c10;
      color: #aaa;
      font-size: 12px;
      display: none;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>GEN-Z.AI</h1>

    <p>
      Buat password baru untuk akun GEN-Z.AI.
    </p>

    <label>Password baru</label>

    <input
      id="password"
      type="password"
      autocomplete="new-password"
      placeholder="Minimal 6 karakter"
    >

    <label>Ulangi password</label>

    <input
      id="passwordConfirm"
      type="password"
      autocomplete="new-password"
      placeholder="Ulangi password"
    >

    <button id="save">
      SIMPAN PASSWORD
    </button>

    <div id="status"></div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="/js/config.js"></script>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        window.AIVideoConfig.SUPABASE_URL,
        window.AIVideoConfig.SUPABASE_PUBLISHABLE_KEY
      );


    const status =
      document.getElementById(
        "status"
      );


    function show(
      message,
      error = false
    ) {

      status.textContent =
        message;

      status.style.display =
        "block";

      status.style.color =
        error
          ? "#ffb4b4"
          : "#bff1c9";
    }


    document
      .getElementById("save")
      .onclick =
      async () => {

        const password =
          document
            .getElementById(
              "password"
            )
            .value;

        const confirm =
          document
            .getElementById(
              "passwordConfirm"
            )
            .value;


        if (
          password.length < 6
        ) {

          show(
            "Password minimal 6 karakter.",
            true
          );

          return;
        }


        if (
          password !== confirm
        ) {

          show(
            "Konfirmasi password tidak sama.",
            true
          );

          return;
        }


        try {

          show(
            "Menyimpan password..."
          );


          const {
            error
          } =
          await supabaseClient
            .auth
            .updateUser({
              password
            });


          if (error) {
            throw error;
          }


          show(
            "Password berhasil diperbarui. Silakan login kembali."
          );


          setTimeout(
            () => {

              location.href =
                "/";

            },
            1800
          );


        } catch (error) {

          show(
            error.message ||
            "Gagal memperbarui password.",
            true
          );

        }

      };

  </script>

</body>

</html>
