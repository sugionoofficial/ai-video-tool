<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Generator - Free AI Image V3</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f8;
  color:#17202a;
  font-family:Arial,sans-serif
}
.app{
  max-width:900px;
  margin:auto;
  padding:20px
}
h1{margin-bottom:4px}
.ver{
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  color:#666
}
.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin:14px 0
}
label{
  display:block;
  font-weight:bold;
  margin:10px 0 6px
}
textarea,input,select{
  width:100%;
  padding:11px;
  border:1px solid #cbd2d9;
  border-radius:8px;
  font:inherit
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}
.hint{
  font-size:12px;
  color:#666
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
  font-weight:bold
}
button:disabled{opacity:.45}
.bar{
  height:7px;
  background:#e5e7e9;
  border-radius:7px;
  margin-top:12px;
  overflow:hidden
}
.bar i{
  display:block;
  width:0;
  height:100%;
  background:#222
}
.imageBox{
  min-height:240px;
  background:#eef1f4;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:8px
}
#imagePreview{
  max-width:100%;
  max-height:600px
}
video{
  width:100%;
  background:#111;
  border-radius:8px
}
#download{
  display:block;
  text-align:center;
  margin-top:12px;
  padding:12px;
  background:#111;
  color:#fff;
  text-decoration:none;
  border-radius:8px
}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .app{padding:12px}
}
</style>
</head>

<body>

<main class="app">

<h1>AI Video Generator</h1>

<p class="ver">FREE AI IMAGE V3</p>

<p>
Prompt menjadi gambar AI nyata, lalu dianimasikan menjadi video.
</p>

<section class="card">

<label>Prompt gambar</label>

<textarea
id="prompt"
rows="4"
placeholder="seekor kucing oren berjalan di taman, photorealistic"
></textarea>

<div class="grid">

<div>
<label>Durasi</label>
<select id="duration">
<option>5</option>
<option>10</option>
</select>
</div>

<div>
<label>Rasio</label>
<select id="aspect">
<option>16:9</option>
<option>9:16</option>
<option>1:1</option>
</select>
</div>

<div>
<label>Model</label>
<select id="model">
<option>flux</option>
<option>gptimage</option>
<option>seedream5</option>
</select>
</div>

</div>

<label>Pollinations publishable key (pk_)</label>

<input
id="apiKey"
type="password"
placeholder="pk_..."
>

<p class="hint">
Gunakan key pk_. Jangan masukkan sk_ secret key ke website atau GitHub.
</p>

<button id="generateImage">
1. Buat Gambar AI
</button>

<button id="makeVideo" disabled>
2. Jadikan Video
</button>

<div id="status">Siap.</div>

<div class="bar">
<i id="progress"></i>
</div>

</section>

<section class="card">

<h2>Hasil Gambar</h2>

<div class="imageBox">
<img id="imagePreview">
</div>

</section>

<section class="card">

<h2>Preview Video</h2>

<video id="videoPreview" controls playsinline></video>

<a id="download" download="ai-video.webm">
Download Video
</a>

</section>

</main>

<script>

const $=id=>document.getElementById(id);

let imageBlob=null;
let imageURL=null;
let videoURL=null;

function stat(s){
  $("status").textContent=s;
}

function prog(n){
  $("progress").style.width=n+"%";
}

function size(a){

  if(a==="9:16")
    return [576,1024];

  if(a==="1:1")
    return [768,768];

  return [1024,576];
}

$("generateImage").onclick=async()=>{

  const p=$("prompt").value.trim();
  const key=$("apiKey").value.trim();

  if(!p){
    stat("Masukkan prompt terlebih dahulu.");
    return;
  }

  if(!key.startsWith("pk_")){
    stat("Masukkan Pollinations publishable key pk_.");
    return;
  }

  $("generateImage").disabled=true;
  $("makeVideo").disabled=true;

  prog(10);
  stat("Membuat gambar AI...");

  try{

    const [w,h]=size($("aspect").value);

    const prompt=encodeURIComponent(
      p+
      ", photorealistic, real animal photography, realistic fur, realistic eyes, natural lighting, high detail, no text, no watermark"
    );

    const url=
      "https://gen.pollinations.ai/image/"+
      prompt+
      "?model="+encodeURIComponent($("model").value)+
      "&width="+w+
      "&height="+h+
      "&key="+encodeURIComponent(key);

    const r=await fetch(url);

    if(!r.ok)
      throw Error("HTTP "+r.status);

    const b=await r.blob();

    if(!b.type.startsWith("image/"))
      throw Error("Respons bukan gambar");

    imageBlob=b;

    if(imageURL)
      URL.revokeObjectURL(imageURL);

    imageURL=URL.createObjectURL(b);

    $("imagePreview").src=imageURL;

    prog(100);

    stat("Gambar AI berhasil dibuat.");

    $("makeVideo").disabled=false;

  }catch(e){

    stat("Gagal: "+e.message);

    prog(0);

  }finally{

    $("generateImage").disabled=false;

  }

};


$("makeVideo").onclick=async()=>{

  if(!imageBlob)
    return;

  $("makeVideo").disabled=true;
  $("generateImage").disabled=true;

  prog(0);
  stat("Menganimasikan gambar menjadi video...");

  try{

    const img=new Image();

    img.src=URL.createObjectURL(imageBlob);

    await img.decode();

    const [w,h]=size($("aspect").value);

    const canvas=document.createElement("canvas");

    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");

    const stream=canvas.captureStream(30);

    const mime=
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp9"
      )
      ?
      "video/webm;codecs=vp9"
      :
      "video/webm";

    const rec=new MediaRecorder(
      stream,
      {
        mimeType:mime,
        videoBitsPerSecond:6000000
      }
    );

    const chunks=[];

    rec.ondataavailable=e=>{

      if(e.data.size)
        chunks.push(e.data);

    };

    const ms=
      Number($("duration").value)*1000;

    const start=performance.now();

    await new Promise((resolve,reject)=>{

      rec.onerror=()=>{
        reject(Error("MediaRecorder gagal"));
      };

      rec.onstop=resolve;

      rec.start(100);

      function render(t){

        const q=Math.min(
          1,
          (t-start)/ms
        );

        const sc=
          Math.max(
            w/img.width,
            h/img.height
          )*(1+0.08*q);

        const iw=img.width*sc;
        const ih=img.height*sc;

        const px=
          (w-iw)/2+
          Math.sin(q*Math.PI*2)*w*.025;

        const py=
          (h-ih)/2+
          Math.cos(q*Math.PI)*h*.012;

        ctx.fillStyle="#111";

        ctx.fillRect(
          0,
          0,
          w,
          h
        );

        ctx.drawImage(
          img,
          px,
          py,
          iw,
          ih
        );

        prog(
          Math.round(q*100)
        );

        if(q<1){

          requestAnimationFrame(render);

        }else{

          rec.stop();

        }

      }

      requestAnimationFrame(render);

    });

    const blob=new Blob(
      chunks,
      {type:"video/webm"}
    );

    if(videoURL)
      URL.revokeObjectURL(videoURL);

    videoURL=
      URL.createObjectURL(blob);

    $("videoPreview").src=videoURL;

    $("download").href=videoURL;

    stat("Video berhasil dibuat.");

    prog(100);

  }catch(e){

    stat("Gagal: "+e.message);

    prog(0);

  }finally{

    $("makeVideo").disabled=false;
    $("generateImage").disabled=false;

  }

};

</script>

</body>
</html>
