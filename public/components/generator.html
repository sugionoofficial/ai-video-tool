<section id="studio" class="generator-page">

  <div class="generator-card">

    <div class="generator-header">
      <h2>AI Video Generator</h2>
      <p>Buat video realistis menggunakan AI</p>
    </div>

    <!-- PROVIDER -->
    <div class="form-group">
      <label for="provider">AI Engine</label>

      <select id="provider">
        <option value="">
          Pilih AI Engine
        </option>
      </select>
    </div>

    <!-- MODEL -->
    <div class="form-group">
      <label for="model">Model</label>

      <select id="model">
        <option value="">
          Pilih model
        </option>
      </select>
    </div>

    <!-- IMAGE -->
    <div class="form-group">

      <label for="image">
        Gambar Referensi
      </label>

      <input
        id="image"
        type="file"
        accept="image/png,image/jpeg,image/webp"
      >

      <small>
        Maksimal 12 MB
      </small>

      <div
        id="imagePreview"
        class="image-preview hidden">
      </div>

    </div>

    <!-- PROMPT -->
    <div class="form-group">

      <label for="prompt">
        Prompt Video
      </label>

      <textarea
        id="prompt"
        rows="7"
        placeholder="Tuliskan prompt video yang ingin dibuat..."
      ></textarea>

    </div>

    <!-- RATIO + DURATION -->
    <div class="form-row">

      <div class="form-group">

        <label for="ratio">
          Rasio
        </label>

        <select id="ratio">
          <option value="">
            Pilih rasio
          </option>
        </select>

      </div>

      <div class="form-group">

        <label for="duration">
          Durasi
        </label>

        <select id="duration">
          <option value="">
            Pilih durasi
          </option>
        </select>

      </div>

    </div>

    <!-- RESOLUTION -->
    <div class="form-group">

      <label for="resolution">
        Resolusi
      </label>

      <select id="resolution">
        <option value="">
          Pilih resolusi
        </option>
      </select>

    </div>

    <!-- PROVIDER BUTTONS -->
    <div
      class="provider-buttons"
      data-providers>
    </div>

    <!-- GENERATE -->
    <button
      id="generateVideo"
      type="button"
      class="generate-btn">

      Generate Video

    </button>

    <!-- STATUS -->
    <div
      id="status"
      class="generator-status">
    </div>

    <!-- RESULT -->
    <section
      id="videoResult"
      class="video-result hidden">

      <div class="result-header">
        <h3>Hasil Video</h3>
      </div>

      <video
        id="video"
        controls
        playsinline>
      </video>

      <div class="video-actions">

        <a
          id="downloadVideo"
          class="download-btn"
          href="#"
          download="gen-z-ai-video.mp4">

          Download Video

        </a>

      </div>

    </section>

  </div>

</section>
