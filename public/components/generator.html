<section id="studio" class="generator-page">
  <div class="generator-shell">

    <div class="generator-hero">
      <h2>AI Video Generator</h2>
      <p>Create realistic AI videos with the Engine of Your Choice</p>
    </div>

    <div class="generator-form">

      <div class="form-group">
        <label for="provider">PROVIDER</label>
        <select id="provider">
          <option value="">Pilih provider</option>
        </select>
      </div>


      <div class="form-group">
        <label for="model">MODEL</label>
        <select id="model">
          <option value="">Pilih model</option>
        </select>

        <div
          id="modelCreditInfo"
          aria-live="polite"
          style="
            display:none;
            margin-top:8px;
            padding:10px 12px;
            border-radius:10px;
            background:rgba(25,135,84,.08);
            border:1px solid rgba(25,135,84,.18);
            font-size:13px;
            line-height:1.5;
          "
        >
          <div
            id="modelCreditBase"
            style="font-weight:600;"
          ></div>

          <div
            id="modelCreditDiscount"
            style="
              margin-top:3px;
              color:#198754;
              font-weight:700;
              opacity:1;
            "
          ></div>

          <div
            id="modelCreditFinal"
            style="
              margin-top:3px;
              font-weight:600;
            "
          ></div>
        </div>
      </div>


      <!-- =====================================================
           REFERENCE IMAGE
      ====================================================== -->

      <div
        id="imageReferenceGroup"
        class="reference-group"
      >

        <label>
          Reference Image
        </label>

        <div
          id="imageReferenceHint"
          class="reference-limit-hint"
          aria-live="polite"
        >
          Pilih model terlebih dahulu.
        </div>


        <div
          id="imageReferenceRow"
          class="reference-row"
        >

          <div
            id="imagePreview"
            class="image-preview hidden"
          ></div>


          <label
            id="imageAddTile"
            class="image-add-tile"
            for="image"
            aria-label="Tambah reference image"
          >
            <span>+</span>
          </label>

        </div>


        <input
          id="image"
          class="image-file-input"
          type="file"
          accept="image/png,image/jpeg,image/webp,image/heic,image/heif"
        >


        <div
          id="imageFileStatus"
          class="image-file-status"
          aria-live="polite"
        >
          Tidak ada file dipilih
        </div>

      </div>


      <!-- =====================================================
           REFERENCE VIDEO
      ====================================================== -->

      <div
        id="videoReferenceGroup"
        class="reference-group hidden"
        style="display:none;"
      >

        <label>
          Reference Video
        </label>


        <div
          id="videoReferenceHint"
          class="reference-limit-hint"
          aria-live="polite"
        >
          Model ini tidak menggunakan video reference.
        </div>


        <div
          id="videoReferenceRow"
          class="reference-row"
        >

          <div
            id="videoPreview"
            class="image-preview video-reference-preview hidden"
          >

            <video
              id="referenceVideoPreview"
              controls
              muted
              playsinline
              preload="metadata"
              style="
                width:100%;
                height:100%;
                object-fit:cover;
                display:block;
                border-radius:inherit;
              "
            ></video>

          </div>


          <label
            id="videoAddTile"
            class="image-add-tile"
            for="referenceVideo"
            aria-label="Tambah reference video"
          >
            <span>+</span>
          </label>

        </div>


        <input
          id="referenceVideo"
          class="image-file-input"
          type="file"
          accept="video/mp4,video/quicktime,video/webm"
        >


        <div
          id="videoFileStatus"
          class="image-file-status"
          aria-live="polite"
        >
          Tidak ada video dipilih
        </div>

      </div>


      <!-- =====================================================
           PROMPT
      ====================================================== -->

      <div class="form-group prompt-group">

        <label for="prompt">
          Video Prompt
        </label>

        <textarea
          id="prompt"
          rows="5"
          placeholder="Describe the video you want to create..."
        ></textarea>

      </div>


      <!-- =====================================================
           OPTIONS
      ====================================================== -->

      <div class="generator-options">

        <div class="form-group">
          <label for="ratio">
            ASPECT RATIO
          </label>

          <select id="ratio">
            <option value="">Pilih aspect ratio</option>
          </select>
        </div>


        <div class="form-group">
          <label for="duration">
            DURATION
          </label>

          <select id="duration">
            <option value="">Pilih durasi</option>
          </select>
        </div>


        <div class="form-group">
          <label for="resolution">
            RESOLUTION
          </label>

          <select id="resolution">
            <option value="">Pilih resolusi</option>
          </select>
        </div>

      </div>


      <!-- =====================================================
           GENERATE
      ====================================================== -->

      <button
        id="generateBtn"
        type="button"
        data-generate-button
        disabled
      >
        Generate Video
      </button>


      <!-- =====================================================
           RESULT
      ====================================================== -->

      <div
        id="result"
        class="generator-result"
      >

        <div
          id="resultLoading"
          class="result-loading hidden"
        >
          <div class="loading-spinner"></div>
          <span>Generating video...</span>
        </div>


        <div
          id="resultVideoContainer"
          class="result-video-container hidden"
        >

          <video
            id="resultVideo"
            controls
            playsinline
            preload="metadata"
          ></video>

        </div>

      </div>

    </div>

  </div>
</section>
