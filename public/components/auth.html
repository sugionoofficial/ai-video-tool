<section
  id="auth"
  class="auth-page"
  style="display:block;"
>

  <div class="auth-card">

    <div class="auth-header">

      <div class="auth-logo">
        GEN-Z.AI
      </div>

      <h1>
        Selamat Datang
      </h1>

      <p>
        Login untuk menggunakan GEN-Z.AI
      </p>

    </div>


    <form
      id="authForm"
      autocomplete="on"
    >

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="Masukkan email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

      </div>


      <div
        id="authMsg"
        class="auth-message"
        aria-live="polite"
      ></div>


      <button
        id="login"
        type="submit"
        class="auth-primary-btn"
      >
        LOGIN
      </button>


      <div class="auth-actions">

        <button
          id="register"
          type="button"
          class="auth-secondary-btn"
        >
          DAFTAR
        </button>

        <button
          id="forgotPassword"
          type="button"
          class="auth-link-btn"
        >
          LUPA PASSWORD?
        </button>

      </div>

    </form>

  </div>

</section>
