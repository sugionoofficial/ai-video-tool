<section id="auth" class="auth-page" style="display:block;">
  <div class="auth-background" aria-hidden="true">
    <div class="auth-grid"></div>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
  </div>

  <div class="auth-shell">

    <div class="auth-brand">
      <div class="auth-brand-mark">
        <span>G</span>
      </div>

      <div class="auth-brand-text">
        <strong>GEN-Z.AI</strong>
        <small>AI CREATIVE STUDIO</small>
      </div>
    </div>

    <div class="auth-status">
      <span class="auth-status-dot"></span>
      <span>AI STUDIO ONLINE</span>
    </div>

    <div class="auth-card">

      <div class="auth-card-glow" aria-hidden="true"></div>

      <div class="auth-header">
        <span class="auth-kicker">WELCOME BACK</span>

        <h1>Selamat datang</h1>

        <p>
          Masuk ke GEN-Z.AI dan mulai membuat
          karya dengan AI.
        </p>
      </div>

      <form id="authForm" autocomplete="on">

        <!-- =====================================================
             EMAIL
        ====================================================== -->

        <div class="form-group">

          <label for="email">EMAIL</label>

          <div class="auth-input-wrap auth-input-fixed">

            <span class="auth-input-icon auth-fixed-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20.5 18.5h-16A1.5 1.5 0 0 1 2.5 17V7A1.5 1.5 0 0 1 4 5.5Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="m3.5 7 7.45 5.1a1.8 1.8 0 0 0 2.1 0L20.5 7"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>

            <input
              id="email"
              name="email"
              type="email"
              class="auth-fixed-input"
              placeholder="nama@email.com"
              autocomplete="email"
              inputmode="email"
              autocapitalize="none"
              spellcheck="false"
              required
            />

          </div>

        </div>

        <!-- =====================================================
             PASSWORD
        ====================================================== -->

        <div class="form-group">

          <div class="auth-label-row">
            <label for="password">PASSWORD</label>

            <button
              id="forgotPassword"
              type="button"
              class="auth-forgot-btn"
            >
              Lupa password?
            </button>
          </div>

          <div class="auth-input-wrap auth-input-fixed auth-password-fixed">

            <span class="auth-input-icon auth-fixed-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect
                  x="4"
                  y="10"
                  width="16"
                  height="11"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.6"
                />

                <path
                  d="M8 10V7.5a4 4 0 0 1 8 0V10"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />

                <circle
                  cx="12"
                  cy="15.5"
                  r="1.2"
                  fill="currentColor"
                />
              </svg>
            </span>

            <input
              id="password"
              name="password"
              type="password"
              class="auth-fixed-input"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            />

            <button
              id="togglePassword"
              type="button"
              class="auth-password-toggle auth-fixed-toggle"
              aria-label="Tampilkan password"
              aria-pressed="false"
            >

              <svg
                class="eye-icon eye-open"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M2.8 12s3.2-5.2 9.2-5.2S21.2 12 21.2 12s-3.2 5.2-9.2 5.2S2.8 12 2.8 12Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />

                <circle
                  cx="12"
                  cy="12"
                  r="2.5"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
              </svg>

              <svg
                class="eye-icon eye-closed"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M3 3l18 18"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

                <path
                  d="M10.6 6.95A10.8 10.8 0 0 1 12 6.8c6 0 9.2 5.2 9.2 5.2a16 16 0 0 1-3.05 3.35M6.1 7.95C3.85 9.45 2.8 12 2.8 12s3.2 5.2 9.2 5.2c1.45 0 2.7-.3 3.8-.75"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

            </button>

          </div>

        </div>

        <!-- =====================================================
             MESSAGE
        ====================================================== -->

        <div
          id="authMsg"
          class="auth-message"
          aria-live="polite"
        ></div>

        <!-- =====================================================
             LOGIN
        ====================================================== -->

        <button
          id="login"
          type="submit"
          class="auth-primary-btn"
        >
          <span class="auth-btn-text">
            MASUK KE GEN-Z.AI
          </span>

          <span
            class="auth-btn-arrow"
            aria-hidden="true"
          >
            →
          </span>
        </button>

        <!-- =====================================================
             DIVIDER
        ====================================================== -->

        <div class="auth-divider">
          <span>ATAU</span>
        </div>

        <!-- =====================================================
             REGISTER
        ====================================================== -->

        <button
          id="register"
          type="button"
          class="auth-secondary-btn"
        >
          <span>BUAT AKUN BARU</span>
          <span aria-hidden="true">↗</span>
        </button>

      </form>

      <!-- =====================================================
           SECURITY
      ====================================================== -->

      <div class="auth-security">

        <span class="auth-lock" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect
              x="5"
              y="10"
              width="14"
              height="10"
              rx="2"
              stroke="currentColor"
              stroke-width="1.5"
            />

            <path
              d="M8 10V7.5a4 4 0 0 1 8 0V10"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span>
          Koneksi aman dan terlindungi
        </span>

      </div>

    </div>

    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="auth-footer">
      <span>GEN-Z.AI</span>
      <span class="auth-footer-separator">•</span>
      <span>CREATE BEYOND IMAGINATION</span>
    </footer>

  </div>
</section>
