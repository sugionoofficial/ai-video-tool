<style>
  /* =========================================================
     GEN-Z.AI
     ACCOUNT MENU
     ========================================================= */

  .account {
    position: relative;

    display: flex;
    align-items: center;
  }


  /* =========================================================
     ACCOUNT BUTTON
     ========================================================= */

  .account-btn {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 44px;
    height: 44px;

    padding: 0;

    border: 1px solid rgba(145, 180, 210, 0.22);
    border-radius: 13px;

    background: rgba(12, 31, 49, 0.72);

    color: #fff;

    box-shadow:
      0 6px 22px rgba(0, 0, 0, 0.22);

    cursor: pointer;

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      transform 0.2s ease;
  }

  .account-btn:hover {
    background: rgba(23, 49, 72, 0.9);

    border-color: rgba(130, 200, 240, 0.45);

    transform: translateY(-1px);
  }

  .account-btn:focus-visible {
    outline: 2px solid rgba(130, 200, 240, 0.65);
    outline-offset: 2px;
  }


  /* =========================================================
     HAMBURGER
     ========================================================= */

  .hamburger {
    display: flex;
    flex-direction: column;

    gap: 5px;

    width: 22px;
  }

  .hamburger i {
    display: block;

    width: 22px;
    height: 2px;

    border-radius: 2px;

    background: #fff;
  }


  /* =========================================================
     ACCOUNT MENU
     ========================================================= */

  .account-menu {
    position: absolute;

    top: calc(100% + 10px);
    right: 0;

    z-index: 1000;

    width: 235px;

    padding: 8px;

    box-sizing: border-box;

    border: 1px solid rgba(145, 180, 210, 0.18);
    border-radius: 15px;

    background:
      linear-gradient(
        145deg,
        rgba(13, 31, 47, 0.98),
        rgba(4, 10, 16, 0.98)
      );

    box-shadow:
      0 24px 65px rgba(0, 0, 0, 0.55);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
  }


  /* =========================================================
     HIDDEN
     ========================================================= */

  .account-menu.hidden {
    display: none !important;
  }


  /* =========================================================
     MENU BUTTON
     ========================================================= */

  .account-menu > button {
    display: block;

    width: 100%;

    min-height: 43px;

    padding: 0 12px;

    box-sizing: border-box;

    border: 0;
    border-radius: 10px;

    background: transparent;

    color: rgba(241, 246, 250, 0.82);

    text-align: left;

    font-family: inherit;

    font-size: 13px;
    font-weight: 700;

    line-height: 1.2;

    cursor: pointer;

    transition:
      background 0.18s ease,
      color 0.18s ease;
  }

  .account-menu > button:hover {
    background: rgba(75, 145, 190, 0.13);

    color: #fff;
  }

  .account-menu > button:focus-visible {
    outline: 2px solid rgba(130, 200, 240, 0.55);
    outline-offset: -2px;
  }


  /* =========================================================
     DIVIDER
     ========================================================= */

  .account-menu-divider {
    height: 1px;

    margin: 6px 0;

    background: rgba(255, 255, 255, 0.08);
  }


  /* =========================================================
     EMAIL
     ========================================================= */

  .account-menu-email {
    display: block;

    padding: 8px 12px 10px;

    color: #fff;

    font-size: 12px;
    font-weight: 800;

    line-height: 1.4;

    word-break: break-word;
  }

  #menuEmail {
    display: block;

    min-width: 0;

    color: #fff;

    font-size: 12px;
    font-weight: 800;

    line-height: 1.4;

    overflow-wrap: anywhere;
  }


  /* =========================================================
     ROLE
     ========================================================= */

  .account-menu-role {
    display: block;

    margin-top: 3px;

    color: rgba(255, 255, 255, 0.42);

    font-size: 9px;
    font-weight: 700;

    line-height: 1.3;

    letter-spacing: 0.08em;

    text-transform: uppercase;
  }


  /* =========================================================
     ROLE BASED MENU
     ========================================================= */

  /*
   * Semua item khusus role disembunyikan secara default.
   * account.js akan menampilkan item yang sesuai setelah
   * role berhasil divalidasi dari server.
   */

  .account-menu-admin-only,
  .account-menu-user-only,
  .account-menu-membership {
    display: none !important;
  }


  /*
   * account.js menggunakan class/visibility untuk
   * menentukan menu berdasarkan role.
   *
   * Class berikut disediakan agar kompatibel dengan
   * implementasi account.js yang sedang digunakan.
   */

  .account-menu-user {
    display: block;
  }


  /* =========================================================
     LOGOUT
     ========================================================= */

  .account-menu .danger {
    color: #fca5a5;
  }

  .account-menu .danger:hover {
    background: rgba(239, 68, 68, 0.09);

    color: #fecaca;
  }


  /* =========================================================
     LEGACY ELEMENTS
     ========================================================= */

  /*
   * Elemen lama tetap dipertahankan karena beberapa
   * modul GEN-Z.AI masih dapat membacanya.
   */

  #userEmail,
  #credits {
    display: none !important;
  }


  /*
   * Email yang tampil di menu berasal dari account.js.
   */

  #menuEmail {
    display: block !important;
  }


  /* =========================================================
     MOBILE
     ========================================================= */

  @media (max-width: 600px) {

    .account-btn {
      width: 42px;
      height: 42px;

      border-radius: 12px;
    }


    .account-menu {
      top: calc(100% + 8px);

      width: min(235px, calc(100vw - 24px));

      padding: 7px;

      border-radius: 14px;
    }


    .account-menu > button {
      min-height: 42px;

      padding: 0 11px;

      font-size: 12px;
    }


    .account-menu-email {
      padding: 8px 11px 9px;
    }


    #menuEmail {
      font-size: 11px;
    }


    .account-menu-role {
      font-size: 8px;
    }

  }


  /* =========================================================
     REDUCED MOTION
     ========================================================= */

  @media (prefers-reduced-motion: reduce) {

    .account-btn,
    .account-menu > button {
      transition: none;
    }

  }
