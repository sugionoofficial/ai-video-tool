<section class="page-card topup-settings-page" id="topupSettingsPage">

  <div class="page-header">
    <button
      type="button"
      class="back-btn"
      id="topupSettingsBack"
      aria-label="Kembali">
      ←
    </button>

    <div>
      <h2>Top Up Setting</h2>
      <p>Tambah kredit pengguna secara manual</p>
    </div>
  </div>

  <div
    id="topupSettingsStatus"
    class="topup-settings-status"
    aria-live="polite">
  </div>

  <div class="topup-settings-card">

    <div class="topup-field">

      <label for="topupUser">
        USER
      </label>

      <select id="topupUser">
        <option value="">Pilih user</option>
      </select>

    </div>

    <div
      class="topup-user-info"
      id="topupUserInfo"
      hidden>

      <div class="topup-user-email">
        <span>Email</span>
        <strong id="topupSelectedEmail">-</strong>
      </div>

      <div class="topup-user-credit">
        <span>Kredit Saat Ini</span>
        <strong id="topupCurrentCredit">0</strong>
      </div>

    </div>

    <div class="topup-field">

      <label for="topupAmount">
        TAMBAH KREDIT
      </label>

      <input
        type="number"
        id="topupAmount"
        min="1"
        step="1"
        inputmode="numeric"
        placeholder="Contoh: 100"
        autocomplete="off">

      <small>
        Masukkan jumlah kredit yang ingin ditambahkan.
      </small>

    </div>

    <div class="topup-field">

      <label for="topupNote">
        CATATAN
      </label>

      <textarea
        id="topupNote"
        rows="3"
        maxlength="500"
        placeholder="Contoh: Top up manual admin"></textarea>

    </div>

    <button
      type="button"
      class="primary-btn topup-submit-btn"
      id="topupSubmit">

      Tambah Kredit

    </button>

  </div>

</section>
