<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GEN-Z.AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .container {
      width: min(760px, 92%);
      margin: 35px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 28px;
    }

    .card {
      background: #15151c;
      border: 1px solid #292936;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: bold;
    }

    input[type="file"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #343440;
      background: #0d0d12;
      color: #fff;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .counter {
      text-align: right;
      color: #888;
      font-size: 12px;
      margin-top: 6px;
    }

    .preview {
      width: 100%;
      max-height: 430px;
      object-fit: contain;
      border-radius: 14px;
      margin-top: 15px;
      background: #050507;
      display: none;
    }

    .info {
      color: #999;
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 13px;
      margin-top: 18px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .connection {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .connection button {
      width: auto;
      margin: 0;
      padding: 10px 15px;
    }

    .status {
      background: #0d0d12;
      border-radius: 12px;
      padding: 14px;
      color: #aaa;
      min-height: 45px;
      line-height: 1.5;
    }

    video {
      width: 100%;
      border-radius: 15px;
      margin-top: 10px;
      background: #000;
      display: none;
    }

    .download {
      display: none;
      text-align: center;
      text-decoration: none;
      background: #fff;
      color: #000;
      padding: 14px;
      border-radius: 12px;
      margin-top: 12px;
      font-weight: bold;
    }

    .native-output {
      padding: 12px;
      border-radius: 12px;
      background: #0d0d12;
      color: #aaa;
      font-size: 13px;
      margin-top: 15px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px auto;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>GEN-Z.AI</h1>

  <div class="subtitle">
    Character Reference → AI Video
  </div>

  <!-- CONNECTION -->

  <div class="card">

    <div class="connection">

      <div>
        <strong>Pollinations</strong>

        <div
          id="connectionStatus"
          class="info"
        >
          Belum terhubung
        </div>
      </div>

      <button
        id="connectPolli"
        type="button"
      >
        Hubungkan
      </button>

      <button
        id="disconnectPolli"
        type="button"
        style="display:none;"
      >
        Putuskan
      </button>

    </div>

  </div>


  <!-- CHARACTER -->

  <div class="card">

    <h2>1. Character Reference</h2>

    <label for="characterFile">
      Upload Foto Karakter
    </label>

    <input
      id="characterFile"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    >

    <div
      id="characterInfo"
      class="info"
    >
      JPG, PNG, atau WEBP. Maksimal 20 MB.
    </div>

    <img
      id="characterPreview"
      class="preview"
      alt="Character Reference"
    >

  </div>


  <!-- PROMPT -->

  <div class="card">

    <h2>2. Video Prompt</h2>

    <textarea
      id="prompt"
      maxlength="512"
      placeholder="Contoh: Karakter berjalan perlahan menuju kamera sambil tersenyum tipis."
    ></textarea>

    <div
      id="promptCounter"
      class="counter"
    >
      0 / 512
    </div>

  </div>


  <!-- SETTINGS -->

  <div class="card">

    <h2>3. Video Settings</h2>

    <div class="grid">

      <div>

        <label for="duration">
          Durasi
        </label>

        <select id="duration">

          <option value="6">
            6 detik
          </option>

        </select>

      </div>


      <div>

        <label for="aspect">
          Aspect Ratio
        </label>

        <select id="aspect">

          <option value="16:9">
            16:9 Native
          </option>

          <option value="9:16">
            9:16 Portrait
          </option>

          <option value="1:1">
            1:1 Square
          </option>

        </select>

      </div>

    </div>


    <label for="seed">
      Seed
    </label>

    <input
      id="seed"
      type="number"
      min="0"
      max="2147483646"
      placeholder="Kosongkan untuk random"
    >

    <div class="native-output">
      Nova Reel Native Output:
      <strong>1280 × 720 • 24 FPS • 16:9</strong>
    </div>


    <button
      id="videoBtn"
      type="button"
    >
      GENERATE VIDEO
    </button>

  </div>


  <!-- STATUS -->

  <div class="card">

    <h2>Status</h2>

    <div
      id="status"
      class="status"
    >
      Siap digunakan.
    </div>

  </div>


  <!-- RESULT -->

  <div class="card">

    <h2>Hasil Video</h2>

    <video
      id="videoPreview"
      controls
      playsinline
    ></video>

    <a
      id="download"
      class="download"
      download="gen-z-ai-video.mp4"
    >
      Download Video
    </a>

  </div>

</div>


<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/video-engine.js"></script>

<script>

  const promptInput =
    document.getElementById("prompt");

  const promptCounter =
    document.getElementById("promptCounter");

  if (promptInput && promptCounter) {

    promptInput.addEventListener(
      "input",
      function () {

        promptCounter.textContent =
          promptInput.value.length +
          " / 512";

      }
    );

  }

</script>

</body>
</html>
