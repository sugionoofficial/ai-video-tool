<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Video Tool V8</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    main {
      width: min(900px, 94%);
      margin: 30px auto;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    textarea,
    select,
    button {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      cursor: pointer;
      background: #111;
      color: white;
      border: none;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .connection {
      margin: 20px 0;
      padding: 17px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #f8fafc;
    }

    .connection-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .connection-status {
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .offline {
      background: #fde8e8;
      color: #991b1b;
    }

    .online {
      background: #e6f7e9;
      color: #166534;
    }

    .danger {
      background: #b91c1c;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .status {
      margin-top: 16px;
      padding: 13px;
      border-radius: 9px;
      background: #eef1f4;
      min-height: 45px;
    }

    .status.ok {
      background: #e6f7e9;
      color: #166534;
    }

    .status.err {
      background: #fde8e8;
      color: #991b1b;
    }

    img,
    video {
      width: 100%;
      margin-top: 18px;
      border-radius: 10px;
      display: none;
    }

    #download {
      display: none;
      margin-top: 14px;
      text-align: center;
      padding: 13px;
      border-radius: 9px;
      background: #111;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }

      main {
        padding: 18px;
        margin: 15px auto;
      }
    }
  </style>
</head>

<body>

<main>

  <h1>AI Video Tool V8</h1>

  <div class="subtitle">
    AI Image Generator → AI Video Generator
  </div>

  <!-- ========================= -->
  <!-- POLLINATIONS CONNECTION -->
  <!-- ========================= -->

  <div class="connection">

    <div class="connection-title">
      🔗 Koneksi Pollinations
    </div>

    <div
      id="pollinationsStatus"
      class="connection-status offline"
    >
      ● Belum terhubung
    </div>

    <button
      id="connectPollinations"
      type="button"
    >
      🔐 Hubungkan Pollinations
    </button>

    <button
      id="disconnectPollinations"
      type="button"
      class="danger"
      style="display:none;"
    >
      Putuskan Koneksi
    </button>

  </div>


  <!-- ========================= -->
  <!-- PROMPT -->
  <!-- ========================= -->

  <label for="prompt">
    Prompt
  </label>

  <textarea
    id="prompt"
    placeholder="Contoh: seorang wanita berjalan perlahan di taman, kamera mengikuti gerakannya secara natural, realistic cinematic video"
  ></textarea>


  <!-- ========================= -->
  <!-- SETTINGS -->
  <!-- ========================= -->

  <div class="row">

    <div>

      <label for="duration">
        Durasi Video
      </label>

      <select id="duration">

        <option value="5">
          5 detik
        </option>

        <option value="10">
          10 detik
        </option>

      </select>

    </div>


    <div>

      <label for="aspect">
        Rasio Video
      </label>

      <select id="aspect">

        <option value="16:9">
          16:9
        </option>

        <option value="9:16">
          9:16
        </option>

        <option value="1:1">
          1:1
        </option>

      </select>

    </div>

  </div>


  <!-- ========================= -->
  <!-- GENERATE BUTTONS -->
  <!-- ========================= -->

  <button
    id="generate"
    type="button"
    disabled
  >
    🎨 Buat Gambar AI
  </button>


  <button
    id="videoBtn"
    type="button"
    disabled
  >
    🎬 Jadikan Video
  </button>


  <!-- ========================= -->
  <!-- STATUS -->
  <!-- ========================= -->

  <div
    id="status"
    class="status"
  >
    Hubungkan Pollinations terlebih dahulu.
  </div>


  <!-- ========================= -->
  <!-- IMAGE -->
  <!-- ========================= -->

  <img
    id="imagePreview"
    alt="Hasil gambar AI"
  >


  <!-- ========================= -->
  <!-- VIDEO -->
  <!-- ========================= -->

  <video
    id="videoPreview"
    controls
    playsinline
  ></video>


  <!-- ========================= -->
  <!-- DOWNLOAD -->
  <!-- ========================= -->

  <a
    id="download"
    href="#"
    download="ai-video.mp4"
  >
    ⬇️ Download Video
  </a>

</main>


<!--
=================================================
AI VIDEO MODULE
=================================================
-->

<script src="/ai_video_real_v8.js"></script>


<script>

(() => {

  /*
  ================================================
  POLLINATIONS OAUTH CONFIG
  ================================================
  */

  const CLIENT_ID =
    "pk_TbW0TG3A2MmE7rOM";

  const REDIRECT_URI =
    window.location.origin + "/";

  const AUTH_URL =
    "https://enter.pollinations.ai/authorize";

  const TOKEN_URL =
    "https://enter.pollinations.ai/api/oauth/token";

  const TOKEN_KEY =
    "polli_access_token";


  /*
  ================================================
  HELPER
  ================================================
  */

  const $ = id =>
    document.getElementById(id);


  function setStatus(
    text,
    type = ""
  ) {

    const status =
      $("status");

    status.textContent =
      text;

    status.className =
      "status " + type;
  }


  /*
  ================================================
  BASE64 URL
  ================================================
  */

  function base64url(bytes) {

    let binary = "";

    bytes.forEach(
      byte => {
        binary +=
          String.fromCharCode(byte);
      }
    );

    return btoa(binary)
      .replace(/\+/g, "-")
      .replace(/\//g, "_")
      .replace(/=+$/g, "");
  }


  /*
  ================================================
  SHA256
  ================================================
  */

  async function sha256(text) {

    const data =
      new TextEncoder()
        .encode(text);

    const hash =
      await crypto.subtle.digest(
        "SHA-256",
        data
      );

    return new Uint8Array(hash);
  }


  /*
  ================================================
  RANDOM STRING
  ================================================
  */

  function randomString(
    length = 64
  ) {

    const chars =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
      "abcdefghijklmnopqrstuvwxyz" +
      "0123456789-._~";

    const bytes =
      crypto.getRandomValues(
        new Uint8Array(length)
      );

    return Array.from(
      bytes,
      byte =>
        chars[
          byte % chars.length
        ]
    ).join("");
  }


  /*
  ================================================
  START OAUTH
  ================================================
  */

  async function startOAuth() {

    const verifier =
      randomString();

    const challenge =
      base64url(
        await sha256(verifier)
      );

    const state =
      randomString(32);


    sessionStorage.setItem(
      "polli_pkce_verifier",
      verifier
    );

    sessionStorage.setItem(
      "polli_oauth_state",
      state
    );


    const params =
      new URLSearchParams({

        client_id:
          CLIENT_ID,

        redirect_uri:
          REDIRECT_URI,

        response_type:
          "code",

        scope:
          "usage",

        code_challenge:
          challenge,

        code_challenge_method:
          "S256",

        state:
          state

      });


    window.location.href =
      AUTH_URL +
      "?" +
      params.toString();
  }


  /*
  ================================================
  OAUTH CALLBACK
  ================================================
  */

  async function handleOAuthCallback() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      params.get("code");

    const state =
      params.get("state");


    if (!code) {
      return;
    }


    const savedState =
      sessionStorage.getItem(
        "polli_oauth_state"
      );

    const verifier =
      sessionStorage.getItem(
        "polli_pkce_verifier"
      );


    if (
      !savedState ||
      !verifier ||
      state !== savedState
    ) {

      setStatus(
        "OAuth gagal: state atau PKCE tidak cocok.",
        "err"
      );

      return;
    }


    setStatus(
      "Menyelesaikan koneksi Pollinations..."
    );


    const body =
      new URLSearchParams({

        grant_type:
          "authorization_code",

        code:
          code,

        client_id:
          CLIENT_ID,

        redirect_uri:
          REDIRECT_URI,

        code_verifier:
          verifier

      });


    const response =
      await fetch(
        TOKEN_URL,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded"
          },

          body:
            body

        }
      );


    const text =
      await response.text();


    if (!response.ok) {

      setStatus(
        "OAuth gagal: HTTP " +
        response.status +
        " - " +
        text.slice(0, 500),

        "err"
      );

      return;
    }


    let data = {};

    try {

      data =
        JSON.parse(text);

    } catch {

      data = {};

    }


    const token =
      data.access_token ||
      data.key ||
      data.token;


    if (!token) {

      setStatus(
        "OAuth berhasil tetapi access token tidak ditemukan.",
        "err"
      );

      return;
    }


    sessionStorage.setItem(
      TOKEN_KEY,
      token
    );


    sessionStorage.removeItem(
      "polli_pkce_verifier"
    );

    sessionStorage.removeItem(
      "polli_oauth_state"
    );


    history.replaceState(
      {},
      document.title,
      window.location.pathname
    );


    updateConnectionUI();


    setStatus(
      "Pollinations berhasil terhubung.",
      "ok"
    );

  }


  /*
  ================================================
  CONNECTION UI
  ================================================
  */

  function updateConnectionUI() {

    const token =
      sessionStorage.getItem(
        TOKEN_KEY
      );

    const connected =
      Boolean(token);


    const status =
      $("pollinationsStatus");

    const connect =
      $("connectPollinations");

    const disconnect =
      $("disconnectPollinations");

    const generate =
      $("generate");


    if (connected) {

      status.textContent =
        "● Pollinations terhubung";

      status.className =
        "connection-status online";


      connect.style.display =
        "none";


      disconnect.style.display =
        "block";


      generate.disabled =
        false;

    }

    else {

      status.textContent =
        "● Belum terhubung";

      status.className =
        "connection-status offline";


      connect.style.display =
        "block";


      disconnect.style.display =
        "none";


      generate.disabled =
        true;

    }

  }


  /*
  ================================================
  CONNECT BUTTON
  ================================================
  */

  $("connectPollinations")
    .addEventListener(
      "click",
      async () => {

        try {

          setStatus(
            "Menghubungkan ke Pollinations..."
          );

          await startOAuth();

        }

        catch (error) {

          setStatus(
            error.message ||
            String(error),

            "err"
          );

        }

      }
    );


  /*
  ================================================
  DISCONNECT BUTTON
  ================================================
  */

  $("disconnectPollinations")
    .addEventListener(
      "click",
      () => {

        sessionStorage.removeItem(
          TOKEN_KEY
        );

        $("videoBtn").disabled =
          true;


        $("imagePreview").style.display =
          "none";


        $("videoPreview").style.display =
          "none";


        $("download").style.display =
          "none";


        updateConnectionUI();


        setStatus(
          "Koneksi Pollinations diputus."
        );

      }
    );


  /*
  ================================================
  GENERATE IMAGE
  ================================================
  */

  $("generate")
    .addEventListener(
      "click",
      async () => {

        const prompt =
          $("prompt")
            .value
            .trim();


        if (!prompt) {

          setStatus(
            "Masukkan prompt terlebih dahulu.",
            "err"
          );

          return;
        }


        const token =
          sessionStorage.getItem(
            TOKEN_KEY
          );


        if (!token) {

          updateConnectionUI();

          setStatus(
            "Hubungkan Pollinations terlebih dahulu.",
            "err"
          );

          return;
        }


        try {

          setStatus(
            "🎨 Membuat gambar AI..."
          );


          const imagePrompt =
            prompt +
            ". High quality realistic image, detailed subject, natural lighting, cinematic quality.";


          const url =
            "https://gen.pollinations.ai/image/" +
            encodeURIComponent(
              imagePrompt
            ) +
            "?model=black-forest-labs/flux.1-schnell" +
            "&width=1024" +
            "&height=1024" +
            "&nologo=true";


          const response =
            await fetch(
              url,
              {
                headers: {
                  Authorization:
                    "Bearer " +
                    token
                }
              }
            );


          if (!response.ok) {

            throw new Error(
              "Gambar gagal: HTTP " +
              response.status
            );

          }


          const blob =
            await response.blob();


          const imageUrl =
            URL.createObjectURL(
              blob
            );


          const image =
            $("imagePreview");


          image.src =
            imageUrl;


          image.style.display =
            "block";


          window.__AI_VIDEO_SOURCE =
            imageUrl;


          $("videoBtn").disabled =
            false;


          setStatus(
            "✅ Gambar berhasil dibuat. Tombol Jadikan Video aktif.",
            "ok"
          );

        }

        catch (error) {

          setStatus(
            error.message ||
            String(error),

            "err"
          );

        }

      }
    );


  /*
  ================================================
  VIDEO BUTTON
  ================================================
  */

  $("videoBtn")
    .addEventListener(
      "click",
      async () => {

        try {

          if (
            typeof window.generateVideoWithNovaReel ===
            "function"
          ) {

            await window.generateVideoWithNovaReel();

          }

          else {

            setStatus(
              "Modul video belum termuat.",
              "err"
            );

          }

        }

        catch (error) {

          setStatus(
            error.message ||
            String(error),

            "err"
          );

        }

      }
    );


  /*
  ================================================
  INITIALIZATION
  ================================================
  */

  updateConnectionUI();


  handleOAuthCallback()
    .catch(
      error => {

        setStatus(
          error.message ||
          String(error),

          "err"
        );

      }
    );

})();

</script>

</body>
</html>
