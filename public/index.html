<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>GEN-Z.AI</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="shell">

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <section
      id="auth"
      class="login-page"
    >

      <div class="login-box">

        <div class="login-brand">

          <h1>GEN-Z.AI</h1>

          <p>
            Generate Video Realistis
          </p>

        </div>


        <div class="login-form">

          <!-- EMAIL -->

          <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
            inputmode="email"
          >


          <!-- PASSWORD -->

          <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
          >


          <!-- LOGIN -->

          <button
            id="login"
            class="login-main"
            type="button"
          >
            LOGIN
          </button>


          <!-- REGISTER / FORGOT PASSWORD -->

          <div class="login-actions">

            <button
              id="register"
              class="login-secondary"
              type="button"
            >
              DAFTAR
            </button>


            <button
              id="forgotPassword"
              class="login-secondary"
              type="button"
            >
              LUPA PASSWORD
            </button>

          </div>


          <!-- AUTH MESSAGE -->

          <p
            id="authMsg"
            class="auth-message"
            aria-live="polite"
          ></p>

        </div>

      </div>

    </section>



    <!-- =====================================================
         MAIN STUDIO
    ====================================================== -->

    <section
      id="studio"
      class="card hidden"
    >

      <!-- TOP BAR -->

      <header class="topbar">

        <button
          id="backToStudio"
          class="icon-btn hidden"
          type="button"
          aria-label="Kembali ke studio"
        >
          ←
        </button>


        <!-- BRAND -->

        <div class="brand">

          <h1>
            GEN-Z.AI
          </h1>

          <p>
            Generate Video Realistis
          </p>

        </div>


        <!-- ACCOUNT -->

        <div class="account">

          <button
            id="accountBtn"
            class="account-btn hidden"
            type="button"
          >

            <span id="userEmail">
              —
            </span>

            <strong id="credits">
              — credit
            </strong>

            <span>
              ⌄
            </span>

          </button>


          <!-- ACCOUNT MENU -->

          <div
            id="accountMenu"
            class="account-menu hidden"
          >

            <div
              class="menu-email"
              id="menuEmail"
            >
              —
            </div>


            <button
              type="button"
              data-page="profile"
            >
              Profil
            </button>


            <button
              type="button"
              data-page="credit"
            >
              Kredit
            </button>


            <button
              type="button"
              data-page="topup"
            >
              Top-up Kredit
            </button>

            <button
              type="button"
              data-page="diagnostic"
            >
              System Diagnostic
            </button>


            <button
              id="adminPanel"
              class="hidden"
              type="button"
            >
              Admin Panel
            </button>


            <button
              id="contactAdmin"
              type="button"
            >
              Kontak Admin
            </button>


            <button
              id="logout"
              class="danger"
              type="button"
            >
              Log out
            </button>

          </div>

        </div>

      </header>



      <!-- =================================================
           PROVIDERS
      ================================================== -->

      <div
        id="providers"
        class="providers"
      >

        <span>
          Memuat provider...
        </span>

      </div>



      <!-- =================================================
           MODEL
      ================================================== -->

      <label>

        Model

        <select
          id="model"
        ></select>

      </label>



      <!-- =================================================
           VIDEO OPTIONS
      ================================================== -->

      <div class="grid">

        <!-- DURATION -->

        <label>

          Durasi

          <select
            id="duration"
          ></select>

        </label>


        <!-- ASPECT -->

        <label>

          Aspect

          <select
            id="aspect"
          ></select>

        </label>


        <!-- RESOLUTION -->

        <label>

          Resolusi

          <select
            id="resolution"
          ></select>

        </label>

      </div>



      <!-- =================================================
           IMAGE
      ================================================== -->

      <label>

        Character / First Frame

        <input
          id="image"
          type="file"
          accept="image/*"
        >

      </label>



      <!-- =================================================
           PROMPT
      ================================================== -->

      <label>

        Prompt

        <textarea
          id="prompt"
          maxlength="2000"
          rows="7"
          placeholder="Deskripsikan video yang ingin dibuat..."
        ></textarea>

      </label>



      <!-- =================================================
           GENERATE
      ================================================== -->

      <button
        id="generate"
        class="primary"
        type="button"
      >
        Generate Video
      </button>



      <!-- =================================================
           STATUS
      ================================================== -->

      <p
        id="status"
        aria-live="polite"
      ></p>



      <!-- =================================================
           VIDEO PREVIEW
      ================================================== -->

      <video
        id="video"
        controls
        playsinline
        class="hidden"
      ></video>



      <!-- =================================================
           DOWNLOAD
      ================================================== -->

      <a
        id="download"
        class="hidden"
        download="gen-z-ai.mp4"
      >
        Download Video
      </a>

    </section>



    <!-- =====================================================
         ACCOUNT PAGE
    ====================================================== -->

    <section
      id="accountPage"
      class="card hidden"
    >

      <div class="page-head">

        <h2 id="pageTitle">
          Profil
        </h2>


        <button
          id="pageBack"
          type="button"
        >
          ← Kembali
        </button>

      </div>


      <div
        id="pageContent"
      ></div>

    </section>

  </main>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/runtime-check.js"></script>
  <script src="/js/diagnostic.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
