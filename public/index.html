<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Tool V8 UP</title>  <style>
    * {
      box-sizing: border-box;

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;

    .subtitle {

    .card {

    .title {

    textarea {
      width: 100%;

      border: 1px solid #34405e;

      outline: none;
    }

    textarea:focus {

    select {
      background: #0b1020;
      color: #fff;
      border: 1px solid #34405e;
      border-radius: 10px;
      padding: 11px 14px;

    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;

      background: #2563eb;

    }

    button:hover {
      opacity: .9;
    }

    button:disabled {

    }

    .status.ok {

    }

    .preview {

      color: #93c5fd;
      font-weight: bold;
      text-decoration: none;
    }
  </style></head><body><div class="container">  <h1>🎬 AI Video Tool V8</h1>  <div class="subtitle">
    AI Image → AI Video menggunakan Pollinations + Amazon Nova Reel
  </div>  <!-- KONEKSI POLLINATIONS -->  <div class="card"><span class="title">
  🔐 Koneksi Pollinations
</span>

<div id="polliStatus" class="status">
  ● Belum terhubung ke Pollinations
</div>

<div class="row">

  <button id="connectPolli">
    🔐 Hubungkan Pollinations
  </button>

  <button id="disconnectPolli" class="danger">
    🔓 Putuskan Koneksi
  </button>

</div>

<div class="small" style="margin-top:10px;">
  Hubungkan akun Pollinations sebelum membuat gambar AI.
</div>

  </div>  <!-- PROMPT -->  <div class="card"><label class="title" for="prompt">
  Prompt
</label>

<textarea
  id="prompt"
  placeholder="Masukkan prompt gambar atau video AI di sini..."
></textarea>

<div class="row" style="margin-top:15px;">

  <div>
    <div class="small">Durasi</div>

    <select id="duration">
      <option value="5">5 detik</option>
      <option value="10">10 detik</option>
    </select>
  </div>

  <div>
    <div class="small">Aspect Ratio</div>

    <select id="aspect">
      <option value="16:9">16:9</option>
      <option value="9:16">9:16</option>
      <option value="1:1">1:1</option>
    </select>
  </div>

</div>

<div class="row" style="margin-top:16px;">

  <button id="generateImage">
    🎨 Buat Gambar AI
  </button>

  <!-- ID HARUS videoBtn -->
  <button id="videoBtn" disabled>
    🎬 Jadikan Video
  </button>

</div>

<!-- ID HARUS status -->
<div id="status" class="status">
  Siap digunakan.
</div>

  </div>  <!-- IMAGE -->  <div class="card"><span class="title">
  🖼️ Preview Gambar
</span>

<img
  id="imagePreview"
  class="preview hidden"
  alt="Preview gambar AI"
>

  </div>  <!-- VIDEO -->  <div class="card"><span class="title">
  🎥 Preview Video
</span>

<video
  id="videoPreview"
  class="preview hidden"
  controls
  playsinline
></video>

<!-- ID HARUS download -->
<a
  id="download"
  class="download hidden"
  download="ai-video-nova-reel.mp4"
>
  ⬇️ Download Video
</a>

  </div></div><script>

(function () {

  const CLIENT_ID = "pk_TbW0TG3A2MmE7rOM";

  const TOKEN_KEY = "polli_access_token";

  const REDIRECT_URI =
    window.location.origin + "/";


  const $ = function (id) {
    return document.getElementById(id);
  };


  const polliStatus = $("polliStatus");

  const statusBox = $("status");


  /*
   * ==========================================
   * TOKEN
   * ==========================================
   */

  function getToken() {

    return (
      localStorage.getItem(TOKEN_KEY) ||
      sessionStorage.getItem(TOKEN_KEY) ||
      sessionStorage.getItem("pollinations_access_token") ||
      sessionStorage.getItem("access_token") ||
      ""
    );

  }


  function saveToken(token) {

    localStorage.setItem(
      TOKEN_KEY,
      token
    );

    sessionStorage.setItem(
      TOKEN_KEY,
      token
    );

  }


  /*
   * ==========================================
   * STATUS
   * ==========================================
   */

  function updateConnectionStatus() {

    if (getToken()) {

      polliStatus.textContent =
        "● Terhubung ke Pollinations";

      polliStatus.classList.add(
        "connected"
      );

    } else {

      polliStatus.textContent =
        "● Belum terhubung ke Pollinations";

      polliStatus.classList.remove(
        "connected"
      );

    }

  }


  function setStatus(
    message,
    type = ""
  ) {

    statusBox.textContent = message;

    statusBox.className =
      "status " + type;

  }


  /*
   * ==========================================
   * CONNECT POLLINATIONS
   * ==========================================
   */

  async function connectPollinations() {

    try {

      const verifier =
        crypto.randomUUID() +
        crypto.randomUUID();


      const hash =
        await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(
            verifier
          )
        );


      const challenge =
        btoa(
          String.fromCharCode(
            ...new Uint8Array(hash)
          )
        )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");


      sessionStorage.setItem(
        "polli_code_verifier",
        verifier
      );


      const authURL =
        new URL(
          "https://enter.pollinations.ai/authorize"
        );


      authURL.searchParams.set(
        "client_id",
        CLIENT_ID
      );

      authURL.searchParams.set(
        "redirect_uri",
        REDIRECT_URI
      );

      authURL.searchParams.set(
        "response_type",
        "code"
      );

      authURL.searchParams.set(
        "code_challenge",
        challenge
      );

      authURL.searchParams.set(
        "code_challenge_method",
        "S256"
      );


      window.location.href =
        authURL.toString();

    } catch (error) {

      setStatus(
        "Gagal memulai koneksi Pollinations: " +
        error.message,
        "err"
      );

    }

  }


  /*
   * ==========================================
   * OAUTH CALLBACK
   * ==========================================
   */

  async function handleOAuthCallback() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      params.get("code");


    const verifier =
      sessionStorage.getItem(
        "polli_code_verifier"
      );


    if (!code || !verifier) {
      return;
    }


    try {

      setStatus(
        "Menghubungkan ke Pollinations..."
      );


      const response =
        await fetch(
          "https://enter.pollinations.ai/api/oauth/token",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              grant_type:
                "authorization_code",

              code:
                code,

              client_id:
                CLIENT_ID,

              redirect_uri:
                REDIRECT_URI,

              code_verifier:
                verifier

            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Token Pollinations gagal diperoleh."
        );

      }


      const accessToken =
        data.access_token ||
        data.token;


      if (!accessToken) {

        throw new Error(
          "Access token tidak ditemukan."
        );

      }


      saveToken(
        accessToken
      );


      sessionStorage.removeItem(
        "polli_code_verifier"
      );


      window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
      );


      updateConnectionStatus();


      setStatus(
        "Pollinations berhasil terhubung.",
        "ok"
      );

    } catch (error) {

      setStatus(
        "Gagal menghubungkan Pollinations: " +
        error.message,
        "err"
      );

    }

  }


  /*
   * ==========================================
   * DISCONNECT
   * ==========================================
   */

  $("disconnectPolli").onclick =
    function () {

      localStorage.removeItem(
        TOKEN_KEY
      );

      sessionStorage.removeItem(
        TOKEN_KEY
      );

      sessionStorage.removeItem(
        "pollinations_access_token"
      );

      sessionStorage.removeItem(
        "access_token"
      );

      updateConnectionStatus();

      setStatus(
        "Koneksi Pollinations diputus."
      );

    };


  $("connectPolli").onclick =
    connectPollinations;


  /*
   * ==========================================
   * GENERATE IMAGE
   * ==========================================
   */

  $("generateImage").onclick =
    async function () {

      const prompt =
        $("prompt").value.trim();


      if (!prompt) {

        setStatus(
          "Masukkan prompt terlebih dahulu.",
          "err"
        );

        return;

      }


      const accessToken =
        getToken();


      if (!accessToken) {

        setStatus(
          "Hubungkan Pollinations terlebih dahulu.",
          "err"
        );

        return;

      }


      try {

        $("generateImage").disabled =
          true;


        setStatus(
          "Sedang membuat gambar AI..."
        );


        const aspect =
          $("aspect").value;


        let width = 1024;

        let height = 1024;


        if (aspect === "16:9") {

          width = 1280;
          height = 720;

        }


        if (aspect === "9:16") {

          width = 720;
          height = 1280;

        }


        const imageURL =
          "https://gen.pollinations.ai/image/" +
          encodeURIComponent(prompt) +
          "?model=black-forest-labs/flux.1-schnell" +
          "&width=" +
          width +
          "&height=" +
          height +
          "&nologo=true";


        const response =
          await fetch(
            imageURL,
            {
              headers: {
                Authorization:
                  "Bearer " +
                  accessToken
              }
            }
          );


        if (!response.ok) {

          throw new Error(
            "Gagal membuat gambar. HTTP " +
            response.status
          );

        }


        const blob =
          await response.blob();


        if (!blob.size) {

          throw new Error(
            "Gambar yang diterima kosong."
          );

        }


        const localImageURL =
          URL.createObjectURL(blob);


        $("imagePreview").src =
          localImageURL;


        $("imagePreview")
          .classList
          .remove("hidden");


        /*
         * DATA UNTUK ENGINE VIDEO V8
         */

        window.__AI_VIDEO_SOURCE =
          localImageURL;

        window.__AI_VIDEO_PROMPT =
          prompt;

        window.__AI_VIDEO_DURATION =
          $("duration").value;

        window.__AI_VIDEO_ASPECT =
          aspect;


        $("videoBtn").disabled =
          false;


        setStatus(
          "Gambar berhasil dibuat. Siap dijadikan video.",
          "ok"
        );

      } catch (error) {

        setStatus(
          "Gagal membuat gambar: " +
          error.message,
          "err"
        );

      } finally {

        $("generateImage").disabled =
          false;

      }

    };


  /*
   * ==========================================
   * VIDEO
   * ==========================================
   *
   * ai_video_real_v8.js menangani proses
   * Amazon Nova Reel.
   */

  $("videoBtn").onclick =
    async function () {

      if (
        typeof window.generateVideoWithNovaReel !==
        "function"
      ) {

        setStatus(
          "Engine video V8 belum termuat. Periksa ai_video_real_v8.js.",
          "err"
        );

        return;

      }


      await window.generateVideoWithNovaReel();

    };


  /*
   * ==========================================
   * START
   * ==========================================
   */

  updateConnectionStatus();

  handleOAuthCallback();

})();

</script><!-- ENGINE VIDEO V8 --><script src="/ai_video_real_v8.js?v=8"></script></body>
</html>
