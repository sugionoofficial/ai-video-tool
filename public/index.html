<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN-Z.AI — AI Video</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header class="topbar"><button id="backToStudio" class="icon-btn hidden" aria-label="Kembali">←</button><div class="brand"><h1>GEN-Z.AI</h1><p>AI Video Studio — Provider dinamis</p></div><div class="account"><button id="accountBtn" class="account-btn hidden"><span id="userEmail">—</span><strong id="credits">— credit</strong><span>⌄</span></button><div id="accountMenu" class="account-menu hidden"><div class="menu-email" id="menuEmail">—</div><button data-page="profile">Profil</button><button data-page="credit">Kredit</button><button data-page="topup">Top-up Kredit</button><button id="adminPanel" class="hidden">Admin Panel</button><button id="contactAdmin">Kontak Admin</button><button id="logout" class="danger">Log out</button></div></div></header>
<section id="auth" class="card auth-card"><h2>Masuk</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button><p id="authMsg"></p></section>
<section id="studio" class="card hidden"><div id="providers" class="providers"><span>Memuat provider...</span></div><label>Model<select id="model"></select></label><div class="grid"><label>Durasi<select id="duration"></select></label><label>Aspect<select id="aspect"></select></label><label>Resolusi<select id="resolution"></select></label></div><label>Character / First Frame <input id="image" type="file" accept="image/*"></label><label>Prompt<textarea id="prompt" maxlength="2000" rows="7" placeholder="Deskripsikan video yang ingin dibuat..."></textarea></label><button id="generate" class="primary">Generate Video</button><p id="status"></p><video id="video" controls class="hidden"></video><a id="download" class="hidden" download="gen-z-ai.mp4">Download Video</a></section>
<section id="accountPage" class="card hidden"><div class="page-head"><h2 id="pageTitle">Profil</h2><button id="pageBack">← Kembali</button></div><div id="pageContent"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/app.js"></script></body></html>
