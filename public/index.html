  <!-- =========================================================
       GEN-Z.AI GENERATION CONTROLLER
       ========================================================= -->

  <script>

  (function () {

    'use strict';


    const GENERATE_TIMEOUT = 30000;

    const STATUS_TIMEOUT = 30000;

    const MAX_REQUEST_BYTES = 65536;

    const MAX_IMAGE_BYTES = 48000;

    const MAX_ERROR_LENGTH = 2000;

    const POLL_INTERVAL = 5000;

    const MAX_POLL_ATTEMPTS = 120;


    let generating = false;

    let pollTimer = null;


    /* =========================================================
       BASIC HELPERS
       ========================================================= */

    function $(id) {

      return document.getElementById(id);

    }


    function setStatus(
      text,
      type
    ) {

      const status =
        $('status');

      if (!status) {

        return;

      }


      status.textContent =
        String(
          text || ''
        );


      status.dataset.type =
        type || 'info';

    }


    function setButtonLoading(
      loading
    ) {

      const button =
        $('generateVideo');

      if (!button) {

        return;

      }


      button.disabled =
        Boolean(
          loading
        );


      button.setAttribute(
        'aria-busy',
        loading
          ? 'true'
          : 'false'
      );


      if (loading) {

        if (
          !button.dataset.originalText
        ) {

          button.dataset.originalText =
            button.textContent ||
            'Generate Video';

        }


        button.textContent =
          'Generating...';

      } else {

        button.textContent =
          button.dataset.originalText ||
          'Generate Video';

      }

    }


    function getValue(
      id
    ) {

      const element =
        $(id);

      if (!element) {

        return '';

      }


      return String(
        element.value ??
        ''
      ).trim();

    }


    /* =========================================================
       ERROR NORMALIZATION
       ========================================================= */

    function firstString(
      values
    ) {

      for (
        const value
        of values
      ) {

        if (
          typeof value ===
          'string' &&
          value.trim()
        ) {

          return value
            .trim()
            .slice(
              0,
              MAX_ERROR_LENGTH
            );

        }

      }


      return '';

    }


    function extractErrorCode(
      value
    ) {

      if (!value) {

        return '';

      }


      const code =
        value?.errorCode ||
        value?.code ||
        value?.error?.code ||
        value?.details?.code ||
        value?.data?.errorCode ||
        value?.data?.code ||
        value?.data?.error?.code ||
        value?.response?.errorCode ||
        value?.response?.code ||
        value?.response?.error?.code ||
        '';


      return String(
        code || ''
      )
        .trim()
        .slice(
          0,
          100
        );

    }


    function extractErrorMessage(
      value
    ) {

      if (!value) {

        return '';

      }


      if (
        typeof value ===
        'string'
      ) {

        return value
          .trim()
          .slice(
            0,
            MAX_ERROR_LENGTH
          );

      }


      const message =
        firstString([
          value?.message,

          value?.error,

          value?.error?.message,

          value?.details?.message,

          value?.details?.error,

          value?.data?.message,

          value?.data?.error,

          value?.data?.error?.message,

          value?.response?.message,

          value?.response?.error,

          value?.response?.error?.message,

          value?.fail_reason,

          value?.data?.fail_reason,

          value?.reason,

          value?.data?.reason
        ]);


      if (message) {

        return message;

      }


      try {

        if (
          typeof value ===
          'object'
        ) {

          const serialized =
            JSON.stringify(
              value
            );


          if (
            serialized &&
            serialized !== '{}'
          ) {

            return serialized.slice(
              0,
              MAX_ERROR_LENGTH
            );

          }

        }

      } catch (_) {}


      return '';

    }


    function formatGenerationError(
      error,
      fallback
    ) {

      const code =
        extractErrorCode(
          error
        );


      const message =
        extractErrorMessage(
          error
        ) ||
        fallback ||
        'Generation gagal.';


      if (
        /^ChinaAPI\s*\[/i.test(
          message
        )
      ) {

        return message;

      }


      if (code) {

        return (
          'Error [' +
          code +
          ']: ' +
          message
        );

      }


      return message;

    }


    /* =========================================================
       IMAGE DATA
       ========================================================= */

    function getImageData() {

      if (
        window.GENZ &&
        window.GENZ.upload &&
        window.GENZ.upload.imageData
      ) {

        return String(
          window.GENZ.upload.imageData
        );

      }


      if (
        window.GENZ &&
        window.GENZ.state &&
        window.GENZ.state.imageData
      ) {

        return String(
          window.GENZ.state.imageData
        );

      }


      return '';

    }


    /* =========================================================
       AUTH TOKEN
       ========================================================= */

    async function getAccessToken() {

      try {

        if (
          window.GENZ_AUTH_CLIENT &&
          window.GENZ_AUTH_CLIENT.auth &&
          typeof
            window.GENZ_AUTH_CLIENT.auth.getSession ===
            'function'
        ) {

          const result =
            await
              window.GENZ_AUTH_CLIENT.auth.getSession();


          const token =
            result?.data?.session?.access_token;


          if (token) {

            return token;

          }

        }

      } catch (error) {

        console.error(
          '[GEN-Z GENERATOR] Session error:',
          error
        );

      }


      try {

        if (
          window.GENZ &&
          window.GENZ.auth &&
          typeof
            window.GENZ.auth.token ===
            'function'
        ) {

          const token =
            await
              window.GENZ.auth.token();


          if (token) {

            return token;

          }

        }

      } catch (error) {

        console.error(
          '[GEN-Z GENERATOR] Token error:',
          error
        );

      }


      return null;

    }


    /* =========================================================
       JSON REQUEST
       ========================================================= */

    async function fetchJson(
      url,
      options,
      timeout
    ) {

      const controller =
        new AbortController();


      const timer =
        setTimeout(
          function () {

            controller.abort();

          },
          timeout
        );


      try {

        let response;


        try {

          response =
            await fetch(
              url,
              {
                ...options,

                signal:
                  controller.signal
              }
            );

        } catch (networkError) {

          if (
            networkError?.name ===
            'AbortError'
          ) {

            throw new Error(
              'Request timeout. Server terlalu lama merespons.'
            );

          }


          throw new Error(
            'Tidak dapat terhubung ke server GEN-Z.AI.'
          );

        }


        let data =
          null;


        const contentType =
          String(
            response.headers.get(
              'content-type'
            ) || ''
          ).toLowerCase();


        if (
          contentType.includes(
            'application/json'
          )
        ) {

          try {

            data =
              await response.json();

          } catch (jsonError) {

            throw new Error(
              `Server mengembalikan JSON yang tidak valid. HTTP ${response.status}.`
            );

          }

        } else {

          const text =
            await response.text();


          data = {

            success:
              false,

            error:
              text ||
              `HTTP ${response.status}`

          };

        }


        if (!response.ok) {

          const message =
            formatGenerationError(
              data,
              `Request gagal (HTTP ${response.status}).`
            );


          const error =
            new Error(
              message
            );


          error.status =
            response.status;


          error.errorCode =
            extractErrorCode(
              data
            );


          error.data =
            data;


          error.response =
            response;


          throw error;

        }


        return data;

      } finally {

        clearTimeout(
          timer
        );

      }

    }


    /* =========================================================
       IDEMPOTENCY KEY
       ========================================================= */

    function createIdempotencyKey() {

      try {

        if (
          window.crypto &&
          typeof
            window.crypto.randomUUID ===
            'function'
        ) {

          return window.crypto.randomUUID();

        }

      } catch (_) {}


      return (
        'gen-' +
        Date.now() +
        '-' +
        Math.random()
          .toString(36)
          .slice(2)
      );

    }


    /* =========================================================
       IMAGE SIZE
       ========================================================= */

    function estimateBytes(
      value
    ) {

      if (!value) {

        return 0;

      }


      return Math.ceil(
        String(value).length *
        0.75
      );

    }


    async function compressImageData(
      imageData
    ) {

      if (!imageData) {

        return '';

      }


      if (
        estimateBytes(
          imageData
        ) <= MAX_IMAGE_BYTES
      ) {

        return imageData;

      }


      if (
        !String(
          imageData
        ).startsWith(
          'data:image/'
        )
      ) {

        throw new Error(
          'Ukuran gambar terlalu besar untuk dikirim ke server.'
        );

      }


      return new Promise(
        function (
          resolve,
          reject
        ) {

          const image =
            new Image();


          image.onload =
            function () {

              try {

                const canvas =
                  document.createElement(
                    'canvas'
                  );


                const maxDimension =
                  768;


                const originalWidth =
                  image.naturalWidth ||
                  image.width ||
                  1;


                const originalHeight =
                  image.naturalHeight ||
                  image.height ||
                  1;


                const largestSide =
                  Math.max(
                    originalWidth,
                    originalHeight
                  );


                const scale =
                  Math.min(
                    1,
                    maxDimension /
                    largestSide
                  );


                canvas.width =
                  Math.max(
                    1,
                    Math.round(
                      originalWidth *
                      scale
                    )
                  );


                canvas.height =
                  Math.max(
                    1,
                    Math.round(
                      originalHeight *
                      scale
                    )
                  );


                const context =
                  canvas.getContext(
                    '2d'
                  );


                if (!context) {

                  reject(
                    new Error(
                      'Browser tidak mendukung pemrosesan gambar.'
                    )
                  );

                  return;

                }


                context.drawImage(
                  image,
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


                const qualities =
                  [
                    0.72,
                    0.62,
                    0.52,
                    0.42,
                    0.32,
                    0.25,
                    0.20
                  ];


                for (
                  const quality
                  of qualities
                ) {

                  const result =
                    canvas.toDataURL(
                      'image/jpeg',
                      quality
                    );


                  if (
                    estimateBytes(
                      result
                    ) <= MAX_IMAGE_BYTES
                  ) {

                    resolve(
                      result
                    );

                    return;

                  }

                }


                reject(
                  new Error(
                    'Ukuran gambar masih terlalu besar. Gunakan gambar yang lebih kecil.'
                  )
                );

              } catch (error) {

                reject(
                  error
                );

              }

            };


          image.onerror =
            function () {

              reject(
                new Error(
                  'Gambar tidak dapat diproses.'
                )
              );

            };


          image.src =
            imageData;

        }
      );

    }


    /* =========================================================
       GENERATION
       ========================================================= */

    async function startGeneration() {

      if (generating) {

        return;

      }


      const provider =
        getValue(
          'provider'
        );


      const model =
        getValue(
          'model'
        );


      const prompt =
        getValue(
          'prompt'
        );


      const aspectRatio =
        getValue(
          'ratio'
        );


      const duration =
        getValue(
          'duration'
        );


      const resolution =
        getValue(
          'resolution'
        );


      /* -------------------------------------------------------
         VALIDATION
         ------------------------------------------------------- */

      if (!provider) {

        setStatus(
          'Pilih provider terlebih dahulu.',
          'error'
        );

        return;

      }


      if (!model) {

        setStatus(
          'Pilih model terlebih dahulu.',
          'error'
        );

        return;

      }


      if (!prompt) {

        setStatus(
          'Prompt wajib diisi.',
          'error'
        );

        $('prompt')?.focus();

        return;

      }


      if (
        prompt.length <
        3
      ) {

        setStatus(
          'Prompt minimal 3 karakter.',
          'error'
        );

        $('prompt')?.focus();

        return;

      }


      generating =
        true;


      setButtonLoading(
        true
      );


      setStatus(
        'Menyiapkan generation...',
        'info'
      );


      try {

        /* -----------------------------------------------------
           AUTH
           ----------------------------------------------------- */

        const token =
          await getAccessToken();


        if (!token) {

          throw new Error(
            'Session login tidak ditemukan. Silakan login kembali.'
          );

        }


        /* -----------------------------------------------------
           IMAGE
           ----------------------------------------------------- */

        let imageData =
          getImageData();


        if (imageData) {

          setStatus(
            'Menyiapkan reference image...',
            'info'
          );


          imageData =
            await
              compressImageData(
                imageData
              );

        }


        /* -----------------------------------------------------
           PAYLOAD
           ----------------------------------------------------- */

        const payload = {

          provider:
            provider,

          model:
            model,

          duration:
            duration || null,

          aspectRatio:
            aspectRatio || null,

          resolution:
            resolution || null,

          prompt:
            prompt,

          imageData:
            imageData || null

        };


        const body =
          JSON.stringify(
            payload
          );


        const requestBytes =
          estimateBytes(
            body
          );


        console.log(
          '[GEN-Z GENERATOR] Request:',
          {
            provider,
            model,
            duration,
            aspectRatio,
            resolution,
            hasImage:
              Boolean(
                imageData
              ),
            requestBytes
          }
        );


        if (
          requestBytes >=
          MAX_REQUEST_BYTES
        ) {

          throw new Error(
            `Data generation terlalu besar (${Math.round(requestBytes / 1024)} KB). Kurangi ukuran gambar.`
          );

        }


        /* -----------------------------------------------------
           SUBMIT
           ----------------------------------------------------- */

        setStatus(
          'Mengirim permintaan generation...',
          'info'
        );


        const result =
          await fetchJson(
            '/api/generate',
            {

              method:
                'POST',

              headers: {

                'Accept':
                  'application/json',

                'Content-Type':
                  'application/json',

                'Authorization':
                  `Bearer ${token}`,

                'Idempotency-Key':
                  createIdempotencyKey()

              },

              credentials:
                'include',

              body:
                body

            },
            GENERATE_TIMEOUT
          );


        console.log(
          '[GEN-Z GENERATOR] Submit response:',
          result
        );


        if (
          !result ||
          result.success === false
        ) {

          throw new Error(
            formatGenerationError(
              result,
              'Generation gagal dimulai.'
            )
          );

        }


        /* -----------------------------------------------------
           JOB ID
           ----------------------------------------------------- */

        const jobId =
          result.jobId ||
          result.id ||
          result.operationName ||
          result.taskId ||
          result.externalId;


        if (!jobId) {

          throw new Error(
            'Server tidak mengembalikan ID generation.'
          );

        }


        setStatus(
          'Generation dimulai. Memproses video...',
          'info'
        );


        await pollStatus(
          provider,
          jobId,
          token
        );


      } catch (error) {

        console.error(
          '[GEN-Z GENERATOR] Generation error:',
          error
        );


        const message =
          formatGenerationError(
            error,
            'Generation gagal diproses.'
          );


        setStatus(
          message,
          'error'
        );


      } finally {

        generating =
          false;


        setButtonLoading(
          false
        );

      }

    }


    /* =========================================================
       STATUS POLLING
       ========================================================= */

    async function pollStatus(
      provider,
      externalId,
      token
    ) {

      let attempts =
        0;


      if (pollTimer) {

        clearTimeout(
          pollTimer
        );

        pollTimer =
          null;

      }


      while (
        attempts <
        MAX_POLL_ATTEMPTS
      ) {

        attempts++;


        let result;


        try {

          result =
            await fetchJson(
              '/api/generate/status',
              {

                method:
                  'POST',

                headers: {

                  'Accept':
                    'application/json',

                  'Content-Type':
                    'application/json',

                  'Authorization':
                    `Bearer ${token}`

                },

                credentials:
                  'include',

                body:
                  JSON.stringify({

                    provider:
                      provider,

                    operationName:
                      externalId

                  })

              },
              STATUS_TIMEOUT
            );


        } catch (error) {

          console.error(
            '[GEN-Z GENERATOR] Status error:',
            error
          );


          throw new Error(
            formatGenerationError(
              error,
              'Gagal memeriksa status generation.'
            )
          );

        }


        console.log(
          '[GEN-Z GENERATOR] Status response:',
          result
        );


        const status =
          String(
            result?.status ||
            result?.providerStatus ||
            result?.state ||
            'processing'
          )
            .trim()
            .toLowerCase();


        /* -----------------------------------------------------
           COMPLETED
           ----------------------------------------------------- */

        if (
          status ===
          'completed' ||
          status ===
          'complete' ||
          status ===
          'success' ||
          status ===
          'succeeded'
        ) {

          const videoUrl =
            result.videoUrl ||
            result.video_url ||
            result.url ||
            result.data?.videoUrl ||
            result.data?.video_url ||
            result.data?.url ||
            `/api/video?provider=${encodeURIComponent(provider)}&jobId=${encodeURIComponent(result.jobId || externalId)}`;


          if (!videoUrl) {

            throw new Error(
              'Generation selesai tetapi URL video tidak ditemukan.'
            );

          }


          showGeneratedVideo(
            videoUrl
          );


          setStatus(
            'Video berhasil dibuat.',
            'success'
          );


          return;

        }


        /* -----------------------------------------------------
           FAILED
           ----------------------------------------------------- */

        if (
          status ===
          'failed' ||
          status ===
          'failure' ||
          status ===
          'error' ||
          status ===
          'cancelled' ||
          status ===
          'canceled'
        ) {

          const errorMessage =
            formatGenerationError(
              result,
              'Provider gagal membuat video.'
            );


          const error =
            new Error(
              errorMessage
            );


          error.errorCode =
            extractErrorCode(
              result
            );


          error.data =
            result;


          throw error;

        }


        /* -----------------------------------------------------
           PROCESSING
           ----------------------------------------------------- */

        const progress =
          result?.progress ||
          result?.data?.progress ||
          '';


        if (progress) {

          setStatus(
            `Generation berjalan... ${progress} (${attempts}/${MAX_POLL_ATTEMPTS})`,
            'info'
          );

        } else {

          setStatus(
            `Generation berjalan... (${attempts}/${MAX_POLL_ATTEMPTS})`,
            'info'
          );

        }


        await new Promise(
          function (
            resolve
          ) {

            pollTimer =
              setTimeout(
                resolve,
                POLL_INTERVAL
              );

          }
        );

      }


      throw new Error(
        'Generation terlalu lama. Periksa status job kembali nanti.'
      );

    }


    /* =========================================================
       SHOW VIDEO
       ========================================================= */

    function showGeneratedVideo(
      videoUrl
    ) {

      if (!videoUrl) {

        throw new Error(
          'URL video tidak ditemukan.'
        );

      }


      const video =
        $('video');


      const download =
        $('downloadVideo') ||
        $('download');


      const result =
        $('videoResult');


      if (!video) {

        throw new Error(
          'Elemen video tidak ditemukan.'
        );

      }


      /* -------------------------------------------------------
         Prefer GENZ.video jika tersedia.
         ------------------------------------------------------- */

      try {

        if (
          window.GENZ &&
          window.GENZ.video &&
          typeof
            window.GENZ.video.show ===
            'function'
        ) {

          window.GENZ.video.show(
            videoUrl
          );

        } else {

          video.pause();

          video.src =
            videoUrl;

          video.controls =
            true;

          video.autoplay =
            false;

          video.loop =
            false;

          video.playsInline =
            true;

          video.classList.remove(
            'hidden'
          );

          video.style.display =
            'block';

          video.load();

        }

      } catch (videoError) {

        console.error(
          '[GEN-Z GENERATOR] Video display error:',
          videoError
        );


        throw new Error(
          extractErrorMessage(
            videoError
          ) ||
          'Video berhasil dibuat tetapi gagal ditampilkan.'
        );

      }


      if (result) {

        result.classList.remove(
          'hidden'
        );

      }


      if (download) {

        download.href =
          videoUrl;

        download.download =
          'gen-z-ai-video.mp4';

        download.classList.remove(
          'hidden'
        );

        download.style.display =
          'inline-flex';

      }

    }


    /* =========================================================
       BUTTON EVENT
       ========================================================= */

    document.addEventListener(
      'click',
      function (
        event
      ) {

        const button =
          event.target?.closest?.(
            '#generateVideo'
          );


        if (!button) {

          return;

        }


        event.preventDefault();

        event.stopPropagation();


        if (
          generating
        ) {

          return;

        }


        startGeneration();

      },
      true
    );


    /* =========================================================
       GLOBAL ERROR LOGGING
       ========================================================= */

    window.addEventListener(
      'unhandledrejection',
      function (
        event
      ) {

        console.error(
          '[GEN-Z GENERATOR] Unhandled promise rejection:',
          event.reason
        );

      }
    );


    window.addEventListener(
      'error',
      function (
        event
      ) {

        console.error(
          '[GEN-Z GENERATOR] Browser error:',
          event.error ||
          event.message
        );

      }
    );


    /* =========================================================
       CLEANUP
       ========================================================= */

    window.addEventListener(
      'beforeunload',
      function () {

        if (pollTimer) {

          clearTimeout(
            pollTimer
          );

          pollTimer =
            null;

        }

      }
    );


    console.log(
      '[GEN-Z GENERATOR] Frontend generation controller loaded.'
    );

  })();

  </script>
