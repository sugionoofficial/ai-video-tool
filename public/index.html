<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Generator - Pollinations OAuth</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}
main{max-width:760px;margin:auto;padding:20px}h1{margin:0 0 6px;font-size:25px}.sub{color:#aaa;margin:0 0 20px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:16px;margin:14px 0}
label{display:block;margin:12px 0 6px;color:#ccc}
textarea,select{width:100%;padding:11px;border-radius:9px;border:1px solid #444;background:#101010;color:#fff;font-size:15px}
button{width:100%;padding:12px;border:0;border-radius:9px;margin-top:12px;font-weight:700;cursor:pointer}
#connect{background:#fff;color:#111}#generate{background:#2d8cff;color:#fff}#videoBtn{background:#444;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}.status{padding:10px;border-radius:8px;background:#101010;color:#bbb;white-space:pre-wrap}
img,video{width:100%;border-radius:10px;margin-top:12px;background:#000;display:none}
a{display:block;text-align:center;color:#8ec5ff;margin-top:12px}.small{font-size:12px;color:#888;line-height:1.5}
.ok{color:#7ee787}.err{color:#ff7b72}
</style>
</head>
<body>
<main>
<h1>AI Video Generator</h1><p class="sub">Pollinations OAuth PKCE</p>
<div class="card">
<button id="connect">Hubungkan Pollinations</button>
<div id="status" class="status">Belum terhubung.</div>
<p class="small">Akses OAuth disimpan hanya di session browser dan tidak dimasukkan ke localStorage.</p>
</div>
<div class="card">
<label for="prompt">Prompt</label>
<textarea id="prompt" rows="4">seekor kucing oren nyata berjalan di taman hijau pada pagi hari, photorealistic</textarea>
<label for="duration">Durasi</label><select id="duration"><option value="5">5 detik</option><option value="10">10 detik</option></select>
<label for="aspect">Aspect Ratio</label><select id="aspect"><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select>
<label for="model">Model</label><select id="model"><option value="flux">flux</option><option value="gptimage">gptimage</option><option value="seedream5">seedream5</option></select>
<button id="generate" disabled>Buat Gambar AI</button>
<button id="videoBtn" disabled>Jadikan Video</button>
<img id="imagePreview" alt="Hasil gambar AI"><video id="videoPreview" controls></video>
<a id="download" download="ai-video.webm" style="display:none">Download Video</a>
</div></main>
<script>
"use strict";
const CLIENT_ID="pk_TbW0TG3A2MmE7rOM";
const REDIRECT_URI="https://ai-video-tool-ten.vercel.app/";
const AUTH_URL="https://enter.pollinations.ai/authorize";
const TOKEN_URL="https://enter.pollinations.ai/api/oauth/token";
const connectBtn=document.getElementById("connect"),generateBtn=document.getElementById("generate"),videoBtn=document.getElementById("videoBtn"),statusEl=document.getElementById("status"),imageEl=document.getElementById("imagePreview"),videoEl=document.getElementById("videoPreview"),downloadEl=document.getElementById("download");
let accessToken=null,imageObjectUrl=null;
function setStatus(t,c=""){statusEl.textContent=t;statusEl.className="status "+c}
function randomString(n=32){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,"0")).join("")}
function base64Url(b){let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function challenge(v){return base64Url(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v))))}
async function startOAuth(){
 if(CLIENT_ID.includes("REPLACE_WITH"))return setStatus("CLIENT_ID belum diisi di index.html.","err");
 const verifier=randomString(48),state=randomString(24),cc=await challenge(verifier);
 sessionStorage.setItem("polli_pkce_verifier",verifier);sessionStorage.setItem("polli_oauth_state",state);
 const p=new URLSearchParams({response_type:"code",client_id:CLIENT_ID,redirect_uri:REDIRECT_URI,scope:"usage",state,code_challenge:cc,code_challenge_method:"S256",models:"flux,gptimage,seedream5",budget:"5",expiry:"7"});
 location.href=AUTH_URL+"?"+p;
}
async function callback(){
 const u=new URL(location.href),code=u.searchParams.get("code"),err=u.searchParams.get("error");
 if(err)return setStatus("OAuth gagal/dibatalkan: "+err,"err"); if(!code)return;
 const state=u.searchParams.get("state"),saved=sessionStorage.getItem("polli_oauth_state"),verifier=sessionStorage.getItem("polli_pkce_verifier");
 if(!saved||!verifier||state!==saved)return setStatus("Validasi OAuth gagal: state/verifier tidak cocok.","err");
 setStatus("Menghubungkan ke Pollinations...");
 try{
  const body=new URLSearchParams({grant_type:"authorization_code",code,client_id:CLIENT_ID,redirect_uri:REDIRECT_URI,code_verifier:verifier});
  const r=await fetch(TOKEN_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
  const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw Error(d.error_description||d.error||("HTTP "+r.status));
  accessToken=d.access_token;sessionStorage.setItem("polli_access_token",accessToken);sessionStorage.removeItem("polli_pkce_verifier");sessionStorage.removeItem("polli_oauth_state");
  history.replaceState({},document.title,REDIRECT_URI);setStatus("Pollinations terhubung. Anda siap membuat gambar.","ok");generateBtn.disabled=false;
 }catch(e){setStatus("Gagal OAuth: "+e.message,"err")}
}
function loadSession(){const x=sessionStorage.getItem("polli_access_token");if(x){accessToken=x;generateBtn.disabled=false;setStatus("Pollinations sudah terhubung pada sesi browser ini.","ok")}}
function dims(a){return a==="9:16"?[768,1365]:a==="1:1"?[1024,1024]:[1365,768]}
async function generateImage(){
 if(!accessToken)return setStatus("Hubungkan Pollinations terlebih dahulu.","err");
 const prompt=document.getElementById("prompt").value.trim(),model=document.getElementById("model").value,[w,h]=dims(document.getElementById("aspect").value);
 if(!prompt)return setStatus("Prompt belum diisi.","err");generateBtn.disabled=true;videoBtn.disabled=true;setStatus("Membuat gambar AI...");
 try{
  const q=encodeURIComponent(prompt+", photorealistic, real animal photography, realistic fur, realistic eyes, natural lighting, high detail, no text, no watermark");
  const r=await fetch("https://gen.pollinations.ai/image/"+q+"?model="+encodeURIComponent(model)+"&width="+w+"&height="+h,{headers:{Authorization:"Bearer "+accessToken}});
  if(!r.ok){if(r.status===401){sessionStorage.removeItem("polli_access_token");accessToken=null}throw Error("HTTP "+r.status)}
  const blob=await r.blob();if(imageObjectUrl)URL.revokeObjectURL(imageObjectUrl);imageObjectUrl=URL.createObjectURL(blob);imageEl.src=imageObjectUrl;imageEl.style.display="block";videoBtn.disabled=false;setStatus("Gambar berhasil dibuat.","ok");
 }catch(e){setStatus("Gagal: "+e.message,"err")}finally{generateBtn.disabled=!accessToken}
}
async function makeVideo(){
 if(!imageEl.src)return;videoBtn.disabled=true;setStatus("Membuat video lokal dari gambar...");
 try{
  const dur=Number(document.getElementById("duration").value),[w,h]=dims(document.getElementById("aspect").value),c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d"),img=new Image();img.src=imageEl.src;await new Promise((a,b)=>{img.onload=a;img.onerror=b});
  const rec=new MediaRecorder(c.captureStream(30),{mimeType:"video/webm"}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(a=>rec.onstop=a);rec.start();const st=performance.now();
  function frame(now){const t=(now-st)/1000,p=Math.min(t/dur,1),fit=Math.max(w/img.naturalWidth,h/img.naturalHeight)*(1+.08*p),dw=img.naturalWidth*fit,dh=img.naturalHeight*fit;ctx.fillStyle="#000";ctx.fillRect(0,0,w,h);ctx.drawImage(img,(w-dw)/2+(p-.5)*w*.04,(h-dh)/2,dw,dh);t<dur?requestAnimationFrame(frame):rec.stop()}requestAnimationFrame(frame);await done;
  const url=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));videoEl.src=url;videoEl.style.display="block";downloadEl.href=url;downloadEl.style.display="block";setStatus("Video berhasil dibuat secara lokal.","ok");
 }catch(e){setStatus("Gagal membuat video: "+e.message,"err")}finally{videoBtn.disabled=false}
}
connectBtn.onclick=startOAuth;generateBtn.onclick=generateImage;videoBtn.onclick=makeVideo;callback().then(loadSession);
</script>
 <script src="video_renderer_v3_2.js"></script>
</body></html>
