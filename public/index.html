<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GEN-Z.AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .container {
      width: min(760px, 92%);
      margin: 35px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 28px;
    }

    .card {
      background: #15151c;
      border: 1px solid #292936;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #343440;
      background: #0d0d12;
      color: #fff;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info {
      color: #999;
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .counter {
      text-align: right;
      color: #888;
      font-size: 12px;
      margin-top: 6px;
    }

    .preview {
      width: 100%;
      max-height: 430px;
      object-fit: contain;
      border-radius: 14px;
      margin-top: 15px;
      background: #050507;
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 13px;
      margin-top: 18px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .connection {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .connection button {
      width: auto;
      margin: 0;
      padding: 10px 15px;
    }

    .status {
      background: #0d0d12;
      border-radius: 12px;
      padding: 14px;
      color: #aaa;
      min-height: 45px;
      line-height: 1.5;
    }

    .status.ok {
      color: #9effb0;
    }

    .status.err {
      color: #ff8f8f;
    }

    video {
      width: 100%;
      border-radius: 15px;
      margin-top: 10px;
      background: #000;
      display: none;
    }

    .download {
      display: none;
      text-align: center;
      text-decoration: none;
      background: #fff;
      color: #000;
      padding: 14px;
      border-radius: 12px;
      margin-top: 12px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>GEN-Z.AI</h1>

  <div class="subtitle">
    Character Reference → AI Video
  </div>

  <!-- PROVIDER -->

  <div class="card">

    <h2>Provider Video</h2>

    <label for="providerSelect">
      Pilih Provider
    </label>

    <select id="providerSelect">

      <option value="pollinations">
        Pollinations
      </option>

      <option value="fal">
        fal.ai
      </option>

      <option value="runway">
        Runway
      </option>

      <option value="veo">
        Google Veo
      </option>

      <option value="luma">
        Luma
      </option>

      <option value="minimax">
        MiniMax / Hailuo
      </option>

    </select>

    <div
      id="providerSettings"
      style="margin-top:10px;"
    ></div>

  </div>


  <!-- CHARACTER -->

  <div class="card">

    <h2>1. Character Reference</h2>

    <label for="characterFile">
      Upload Foto Karakter
    </label>

    <input
      id="characterFile"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    >

    <div
      id="characterInfo"
      class="info"
    >
      JPG, PNG, atau WEBP. Maksimal 20 MB.
    </div>

    <img
      id="characterPreview"
      class="preview"
      alt="Character Reference"
    >

  </div>


  <!-- PROMPT -->

  <div class="card">

    <h2>2. Video Prompt</h2>

    <textarea
      id="prompt"
      maxlength="512"
      placeholder="Contoh: Karakter berjalan perlahan menuju kamera sambil tersenyum."
    ></textarea>

    <div
      id="promptCounter"
      class="counter"
    >
      0 / 512
    </div>

  </div>


  <!-- SETTINGS -->

  <div class="card">

    <h2>3. Video Settings</h2>

    <div class="grid">

      <div>

        <label for="duration">
          Durasi
        </label>

        <select id="duration">

          <option value="4">
            4 detik
          </option>

          <option value="5">
            5 detik
          </option>

          <option value="6" selected>
            6 detik
          </option>

          <option value="8">
            8 detik
          </option>

          <option value="10">
            10 detik
          </option>

          <option value="12">
            12 detik
          </option>

        </select>

      </div>

      <div>

        <label for="aspect">
          Aspect Ratio
        </label>

        <select id="aspect">

          <option value="16:9">
            16:9
          </option>

          <option value="9:16">
            9:16
          </option>

          <option value="1:1">
            1:1
          </option>

        </select>

      </div>

    </div>


    <label for="seed">
      Seed
    </label>

    <input
      id="seed"
      type="number"
      min="0"
      max="2147483646"
      placeholder="Kosongkan untuk random"
    >


    <button
      id="videoBtn"
      type="button"
    >
      GENERATE VIDEO
    </button>

  </div>


  <!-- STATUS -->

  <div class="card">

    <h2>Status</h2>

    <div
      id="status"
      class="status"
    >
      Siap digunakan.
    </div>

  </div>


  <!-- RESULT -->

  <div class="card">

    <h2>Hasil Video</h2>

    <video
      id="videoPreview"
      controls
      playsinline
    ></video>

    <a
      id="download"
      class="download"
      download="gen-z-ai-video.mp4"
    >
      Download Video
    </a>

  </div>

</div>


<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>

<script src="/js/providers/pollinations.js"></script>
<script src="/js/providers/fal.js"></script>
<script src="/js/providers/runway.js"></script>

<script src="/js/providers/veo.js"></script>
<script src="/js/providers/luma.js"></script>
<script src="/js/providers/minimax.js"></script>

<script src="/js/app.js"></script>

</body>
</html>
