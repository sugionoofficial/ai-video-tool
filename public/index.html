<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN-Z.AI — AI Video</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header><div><h1>GEN-Z.AI</h1><p>AI Video Studio — Gemini/Veo · MiniMax · Luma</p></div><div class="account"><span id="userEmail">Belum login</span><strong id="credits">— credit</strong><button id="logout">Logout</button></div></header><section id="auth" class="card"><h2>Masuk</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button><p id="authMsg"></p></section><section id="studio" class="card hidden"><div class="providers"><button class="provider active" data-provider="veo">Gemini <small>Veo 3.1</small></button><button class="provider" data-provider="minimax">MiniMax <small>Hailuo</small></button><button class="provider" data-provider="luma">Luma <small>Dream Machine</small></button></div><label>Model<select id="model"></select></label><div class="grid"><label>Durasi<select id="duration"></select></label><label>Aspect<select id="aspect"></select></label><label>Resolusi<select id="resolution"></select></label></div><label>Character / First Frame <input id="image" type="file" accept="image/*"></label><label>Prompt<textarea id="prompt" maxlength="2000" rows="7" placeholder="Deskripsikan video yang ingin dibuat..."></textarea></label><button id="generate" class="primary">Generate Video</button><p id="status"></p><video id="video" controls class="hidden"></video><a id="download" class="hidden" download="gen-z-ai.mp4">Download Video</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/app.js"></script></body></html>
