<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Video Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">AI Video Generator</div>
    <div class="status"><span id="statusDot"></span><span id="statusText">Ready</span></div>
  </header>

  <main class="app">
    <section class="panel">
      <h1>Create video</h1>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="5" placeholder="Describe the video you want to generate..."></textarea>

      <div class="grid">
        <div>
          <label for="provider">Provider</label>
          <select id="provider">
            <option value="mock" selected>Free Local Testing</option>
            <option value="runway">Runway</option>
          </select>
        </div>
        <div>
          <label for="model">Model</label>
          <select id="model">
            <option value="local">Free Local Preview</option>
            <option value="gen4.5">Runway Gen-4.5</option>
          </select>
        </div>
        <div>
          <label for="duration">Duration</label>
          <select id="duration">
            <option value="5">5 seconds</option>
            <option value="10">10 seconds</option>
        </select>
        </div>
        <div>
          <label for="aspectRatio">Aspect ratio</label>
          <select id="aspectRatio">
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="1:1">1:1</option>
          </select>
        </div>
      </div>

      <label for="image">Reference image</label>
      <input id="image" type="file" accept="image/png,image/jpeg,image/webp">

      <button id="generateBtn" class="primary">Generate video</button>
      <p id="message" class="message"></p>
    </section>

    <section class="panel preview-panel">
      <div class="section-head">
        <h2>Preview</h2>
        <a id="downloadBtn" class="download disabled" href="#" download>Download</a>
      </div>
      <div class="preview">
        <video id="video" controls playsinline></video>
        <div id="emptyPreview">Generated video will appear here.</div>
      </div>
    </section>

    <section class="panel timeline-panel">
      <div class="section-head">
        <h2>Timeline</h2>
        <button id="addSceneBtn" class="secondary">Add scene</button>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <script src="timeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
