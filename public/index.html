<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Generator - Free AI Image V3</title><link rel="stylesheet" href="style.css?v=3"></head><body><main class="app"><h1>AI Video Generator</h1><p class="ver">FREE AI IMAGE V3</p><p>Prompt menjadi gambar AI nyata, lalu dianimasikan menjadi video.</p><section class="card"><label>Prompt gambar</label><textarea id="prompt" rows="4" placeholder="seekor kucing oren berjalan di taman, photorealistic"></textarea><div class="grid"><div><label>Durasi</label><select id="duration"><option>5</option><option>10</option></select></div><div><label>Rasio</label><select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option></select></div><div><label>Model</label><select id="model"><option>flux</option><option>gptimage</option><option>seedream5</option></select></div></div><label>Pollinations publishable key (pk_)</label><input id="apiKey" type="password" placeholder="pk_..."><p class="hint">Gunakan key pk_. Jangan masukkan sk_ secret key ke website atau GitHub.</p><button id="generateImage">1. Buat Gambar AI</button><button id="makeVideo" disabled>2. Jadikan Video</button><div id="status">Siap.</div><div class="bar"><i id="progress"></i></div></section><section class="card"><h2>Hasil Gambar</h2><div class="imageBox"><img id="imagePreview"></div></section><section class="card"><h2>Preview Video</h2><video id="videoPreview" controls playsinline></video><a id="download" download="ai-video.webm">Download Video</a></section></main><script src="app.js?v=3"></script></body></html>
