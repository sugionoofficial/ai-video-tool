<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN-Z.AI Admin Panel</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header class="topbar"><a class="icon-btn link-btn" href="/" aria-label="Kembali ke studio">←</a><div class="brand"><h1>GEN-Z.AI</h1><p>Admin Panel</p></div><div class="account"><span id="adminEmail">—</span><strong>ADMIN</strong></div></header>
<section class="card"><h2>Provider Management</h2><p>Provider dapat ditambah, diedit, diaktifkan/nonaktifkan, atau dihapus. API key hanya disimpan di server.</p><div class="grid"><label>Provider ID<input id="providerId" placeholder="contoh: veo"></label><label>Nama Provider<input id="providerName" placeholder="Nama yang tampil"></label><label>Adapter<select id="adapter"><option value="veo">Veo</option><option value="minimax">MiniMax</option><option value="luma">Luma</option></select></label></div><label>API Key<input id="key" type="password" autocomplete="new-password" placeholder="Masukkan key baru"></label><label class="check"><input id="enabled" type="checkbox" checked> Aktif</label><div><button id="saveProvider">Tambah Provider</button><button id="cancelEdit" class="hidden">Batal Edit</button></div><div id="providerState"></div></section>
<section class="card"><h2>Top-up / Kelola Kredit</h2><p>Admin dapat menambah atau mengurangi kredit user.</p><button id="refreshUsers">Refresh User</button><div id="userTable" class="user-table"></div></section>
<section class="card"><h2>Kontak Admin</h2><input id="contact" placeholder="https://wa.me/... atau URL kontak"><button id="saveContact">Simpan Kontak</button></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/admin.js"></script></body></html>
