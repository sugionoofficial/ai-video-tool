<!doctype html>

<html lang="id">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>GEN-Z.AI Admin - Users</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    .users-page {
      min-height:100vh;
    }

    .users-header {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:24px;
    }

    .users-back {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:44px;
      height:44px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      background:rgba(255,255,255,.05);
      color:inherit;
      text-decoration:none;
      font-size:20px;
    }

    .users-back:hover {
      background:rgba(255,255,255,.09);
    }

    .users-title h1 {
      margin:0;
      font-size:24px;
    }

    .users-title p {
      margin:4px 0 0;
      opacity:.65;
    }

    .users-account {
      margin-left:auto;
      text-align:right;
    }

    .users-account span {
      display:block;
      font-size:13px;
      opacity:.7;
    }

    .users-account strong {
      display:block;
      margin-top:3px;
      font-size:10px;
      letter-spacing:.12em;
      opacity:.6;
    }

    .users-navigation {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:20px;
    }

    .users-navigation a {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:40px;
      padding:0 14px;
      border:1px solid rgba(255,255,255,.09);
      border-radius:10px;
      background:rgba(255,255,255,.025);
      color:inherit;
      text-decoration:none;
    }

    .users-navigation a:hover,
    .users-navigation a.active {
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.18);
    }

    .users-toolbar {
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:16px;
    }

    .users-search {
      flex:1;
      min-width:0;
    }

    .users-search input {
      width:100%;
      box-sizing:border-box;
      min-height:42px;
      padding:0 13px;
      border:1px solid rgba(255,255,255,.1);
      border-radius:10px;
      background:rgba(255,255,255,.035);
      color:inherit;
      outline:none;
    }

    .users-search input:focus {
      border-color:rgba(255,255,255,.25);
    }

    .users-refresh {
      min-height:42px;
      padding:0 15px;
      border:1px solid rgba(255,255,255,.1);
      border-radius:10px;
      background:rgba(255,255,255,.04);
      color:inherit;
      cursor:pointer;
    }

    .users-refresh:hover {
      background:rgba(255,255,255,.08);
    }

    .users-status {
      min-height:20px;
      margin-bottom:14px;
      font-size:13px;
      opacity:.75;
    }

    .users-table-wrap {
      overflow-x:auto;
    }

    .users-table {
      width:100%;
      border-collapse:collapse;
      min-width:780px;
    }
