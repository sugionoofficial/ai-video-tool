<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Tool V8</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px;background:#f5f5f5}.card{background:#fff;padding:20px;border-radius:14px}textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;font-size:16px}button{cursor:pointer;background:#222;color:#fff;border:0;border-radius:8px}button:disabled{opacity:.45}img,video{width:100%;max-width:100%;margin-top:10px;border-radius:10px}.status{margin-top:10px;padding:12px;background:#eee;border-radius:8px}.status.ok{background:#dff5df}.status.err{background:#ffdede}a{display:block;margin-top:10px;padding:12px;background:#222;color:#fff;text-align:center;text-decoration:none;border-radius:8px}</style></head><body><div class="card"><h2>AI Video Tool V8</h2><textarea id="prompt" placeholder="Tulis prompt..."></textarea><select id="duration"><option value="5">5 detik</option><option value="10">10 detik</option></select><select id="aspect"><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select><button id="generate">Buat Gambar AI</button><button id="videoBtn" type="button" disabled onclick="generateVideoWithNovaReel()">Jadikan Video</button><div id="status" class="status">Siap.</div><img id="imagePreview" style="display:none" alt=""><video id="videoPreview" style="display:none" controls></video><a id="download" style="display:none" href="#">Download Video</a></div><script>
const CLIENT_ID="pk_TbW0TG3A2MmE7rOM",REDIRECT_URI="https://ai-video-tool-ten.vercel.app/",AUTH_URL="https://enter.pollinations.ai/authorize",TOKEN_URL="https://enter.pollinations.ai/api/oauth/token",KEY="polli_access_token";const S=id=>document.getElementById(id);function st(t,c=""){S("status").textContent=t;S("status").className="status "+c}async function oauth(){const u=new URL(AUTH_URL);u.searchParams.set("client_id",CLIENT_ID);u.searchParams.set("redirect_uri",REDIRECT_URI);u.searchParams.set("response_type","code");u.searchParams.set("scope","usage");location.href=u}async function exchange(code){try{const r=await fetch(TOKEN_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({grant_type:"authorization_code",client_id:CLIENT_ID,code,redirect_uri:REDIRECT_URI})}),d=await r.json();if(!d.access_token)throw Error("OAuth gagal");sessionStorage.setItem(KEY,d.access_token);history.replaceState({},document.title,REDIRECT_URI);st("Pollinations terhubung.","ok")}catch(e){st(e.message,"err")}}(async()=>{const code=new URLSearchParams(location.search).get("code");if(code)await exchange(code);const t=sessionStorage.getItem(KEY);if(!t){S("generate").textContent="Hubungkan Pollinations";S("generate").onclick=oauth;return}S("generate").onclick=async()=>{const p=S("prompt").value.trim();if(!p){st("Masukkan prompt terlebih dahulu.","err");return}st("Membuat gambar AI...");try{const r=await fetch("https://gen.pollinations.ai/image/"+encodeURIComponent(p)+"?model=black-forest-labs%2Fflux.1-schnell&width=1024&height=1024",{headers:{Authorization:"Bearer "+t}});if(!r.ok)throw Error("Gambar gagal: HTTP "+r.status);const b=await r.blob();S("imagePreview").src=URL.createObjectURL(b);S("imagePreview").style.display="block";S("videoBtn").disabled=false;st("Gambar siap. Tombol Jadikan Video aktif.","ok")}catch(e){st(e.message,"err")}}})();</script><script src="ai_video_real_v8.js?v=8"></script></body></html>
